name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  # pull_request:
  #   branches:
  #     - master

permissions:
  contents: write

# 取消正在运行的旧工作流
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== Windows 构建 ==========
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # cache: 'npm'
          # cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Resolve version
        id: version
        # tag push（如 v1.2.3）→ VERSION=1.2.3；普通 push → VERSION= 空，electron-builder 回退到 package.json
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSL_ESIGNER_USER_NAME: ${{ secrets.SSL_ESIGNER_USER_NAME }}
          SSL_ESIGNER_USER_PASSWORD: ${{ secrets.SSL_ESIGNER_USER_PASSWORD }}
          SSL_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_ESIGNER_CREDENTIAL_ID }}
          SSL_ESIGNER_USER_TOTP: ${{ secrets.SSL_ESIGNER_USER_TOTP }}
          SIGN_APPLICATION: 1
          # electron-builder 在 Linux/Windows 下会用 VERSION 环境变量覆盖 package.json 的 version 字段
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          # defaults.run.working-directory 只影响 run 步骤，upload-artifact 的 path 仍按
          # 仓库根解析；产物实际在 app/dist/ 下，所以 path 必须从仓库根写
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
          if-no-files-found: error

  # ========== macOS 构建 ==========
  # build-macos:
  #   name: Build for macOS
  #   needs: test
  #   runs-on: macos-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'

  #     - name: Install Dependencies
  #       run: npm ci

  #     - name: Build
  #       run: npm run build
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         APPLE_ID: ${{ secrets.APPLE_ID }}
  #         APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  #         APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  #     - name: Upload macOS Artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: macos-build
  #         path: |
  #           dist/*.dmg
  #           dist/*.zip
  #         if-no-files-found: ignore

  # ========== Linux 构建 ==========
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # cache: 'npm'
          # cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Resolve version
        id: version
        # tag push（如 v1.2.3）→ VERSION=1.2.3；普通 push → VERSION= 空，electron-builder 回退到 package.json
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder 在 Linux/Windows 下会用 VERSION 环境变量覆盖 package.json 的 version 字段
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          # defaults.run.working-directory 只影响 run 步骤，upload-artifact 的 path 仍按
          # 仓库根解析；产物实际在 app/dist/ 下，所以 path 必须从仓库根写
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/latest-linux.yml
          if-no-files-found: error

  # ========== 发布到 GitHub Releases ==========
  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 走默认 merge-multiple: true 行为：所有 artifacts 合并到 artifacts/ 下，
          # 文件按上传时的路径展开（app/dist/QuasarX_Setup_*.exe 等）
          merge-multiple: true

      - name: List collected artifacts
        run: |
          echo "=== Files collected for release ==="
          find artifacts -type f -printf '%p\t%s bytes\n' | sort
          echo "================================="
          # 兜底检查：关键产物不在时直接报错（关键检查改为 if-no-files-found: error 后这一步是双保险）
          if [ -z "$(find artifacts -maxdepth 2 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) 2>/dev/null)" ]; then
            echo "ERROR: no app installer artifacts found (no .exe/.AppImage/.deb/.rpm)"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # 仓库根目录为 cliff.toml 所在处，git-cliff action 默认就在那里跑
          args: --tag ${{ github.ref_name }} --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview changelog
        run: |
          echo "=== CHANGELOG.md (first 80 lines) ==="
          head -80 CHANGELOG.md
          echo "===================================="

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.blockmap
            artifacts/latest-linux.yml
            CHANGELOG.md
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          # CHANGELOG.md 已经覆盖 release body，不再额外生成 GitHub auto notes
          generate_release_notes: false
          fail_on_unmatched_files: true
          # 与 service.yml 的 release 复用同一个 release（同 tag 多次运行追加资产）
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}