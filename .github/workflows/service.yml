      # === 阶段 2.5: 失败时诊断 OOM / 内存 ===
      - name: Diagnose OOM and memory (on failure)
        if: failure()
        run: |
          echo "========== OOM / Memory Diagnosis =========="

          echo "--- dmesg OOM kills (last 20 lines) ---"
          sudo dmesg -T 2>/dev/null | grep -i -E "oom|killed process|out of memory" | tail -20 || \
            dmesg 2>/dev/null | grep -i -E "oom|killed process|out of memory" | tail -20 || \
            echo "(dmesg not available or no OOM found)"

          echo ""
          echo "--- Current memory status ---"
          free -h
          echo ""
          cat /proc/meminfo | head -10

          echo ""
          echo "--- Service process RSS before exit ---"
          # service_test.log 中最后几行可能包含崩溃信息
          echo "--- service_test.log tail (last 30 lines) ---"
          tail -30 service_test.log 2>/dev/null || echo "(log not found)"

          echo ""
          echo "--- QuantService core dump check ---"
          ls -lh core* /tmp/core* 2>/dev/null || echo "(no core dumps found)"

          echo "========== End OOM Diagnosis =========="

      # === 阶段 3: 测试通过后上传最终构建 ===
      - name: Upload Build (passed tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            QuantService
            stock_hist_sim.json
          compression-level: 5

      - name: Show service log (last 100 lines)
        if: always()
        run: |
          echo "=== Last 100 lines of spdlog ==="
          tail -100 logs/monthly_log.txt 2>/dev/null || echo "(log not found)"

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            logs/
          compression-level: 5
          retention-days: 7

      - name: Upload test failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-report
          path: |
            service_lifecycle.log
            service_test.log
            service_tickflow.log
            config.json
            stock_hist_sim.json
            tickflow.json
          compression-level: 0
          retention-days: 7

      - name: Upload configs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-configs
          path: |
            config.json
            stock_hist_sim.json
            tickflow.json
          compression-level: 5
          retention-days: 3
# ========== 发布到 GitHub Releases ==========
  release:
    name: Create Release
    needs: [test]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Download runtime libs
        uses: actions/download-artifact@v4
        with:
          name: runtime-libs
          path: runtime-libs

      - name: Package release tarball
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_DIR="QuantService-${TAG_NAME}"
          mkdir -p "${RELEASE_DIR}"

          # 主二进制 + 配置模板
          cp build-artifact/QuantService "${RELEASE_DIR}/"
          cp build-artifact/config.template.json "${RELEASE_DIR}/"

          # 运行时 so 库
          mkdir -p "${RELEASE_DIR}/lib"
          cp runtime-libs/usr/local/lib/lib*.so* "${RELEASE_DIR}/lib/" 2>/dev/null || true
          cp runtime-libs/home/runner/work/QuasarX/QuasarX/service/third_party/libs/unix/lib*.so "${RELEASE_DIR}/lib/" 2>/dev/null || true

          # 工具脚本
          cp -r build-artifact/tools "${RELEASE_DIR}/" 2>/dev/null || true

          # 生成版本信息
          echo "${TAG_NAME}" > "${RELEASE_DIR}/VERSION"
          echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "${RELEASE_DIR}/VERSION"
          echo "Commit: ${GITHUB_SHA}" >> "${RELEASE_DIR}/VERSION"

          # 打包
          tar -czf "QuantService-${TAG_NAME}.tar.gz" "${RELEASE_DIR}"
          echo "=== Package contents ==="
          tar -tzf "QuantService-${TAG_NAME}.tar.gz" | head -30
          echo "========================"
          ls -lh "QuantService-${TAG_NAME}.tar.gz"

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2
