name: Build Service
on: 
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: /home/runner/work/ccache  # ccache 缓存目录
    steps:
      # - name: Install GCC 13+ (C++23 support)
      #   run: |
      #     sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
      #     sudo apt-get install -y g++-13 gcc-13
      #     sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 90
      #     sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 90
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # 指定明确版本如 '3.12'

      # 配置 ccache 编译缓存
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-xgboost
          max-size: 1024M  # 限制缓存大小

      # 4. 缓存 xgboost（固定版本，升级时改 key 中的版本号）
      - name: Cache xgboost build
        uses: actions/cache@v4
        id: cache-xgboost
        with:
          path: |
            xgboost/build
            /usr/local/include/xgboost
            /usr/local/lib/libxgboost.*
          key: ${{ runner.os }}-xgboost-v3.3.0
          restore-keys: |
            ${{ runner.os }}-xgboost-

      - name: Cache Boost build
        uses: actions/cache@v4
        id: cache-boost
        with:
          path: |
            /usr/local/include/boost
            /usr/local/lib/libboost*
          key: ${{ runner.os }}-boost-v1.89.0
          restore-keys: |
            ${{ runner.os }}-boost

      - name: Cache DuckDB build
        uses: actions/cache@v4
        id: cache-duckdb
        with:
          path: |
            duckdb/build
            /usr/local/lib/libduckdb*
            /usr/local/include/duckdb*
          key: ${{ runner.os }}-duckdb-v1.5.4
          restore-keys: |
            ${{ runner.os }}-duckdb-

      - name: Install dependencies
        if: steps.cache-xgboost.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y  libmlpack-dev libarmadillo-dev libpapi-dev libssl-dev 7zip
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install cython
          cython --version

      # 仅当缓存未命中时编译 xgboost
      - name: Build xgboost (if cache miss)
        if: steps.cache-xgboost.outputs.cache-hit != 'true'
        run: |
          git clone --branch v3.3.0 --depth 1 --recursive https://github.com/dmlc/xgboost
          cd xgboost
          mkdir build && cd build
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

      - name: Build boost (if cache miss)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          wget https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.gz
          tar -xzf boost_1_89_0.tar.gz
          cd boost_1_89_0
          ./bootstrap.sh --prefix=stage
          ./b2 install
          sudo cp -r stage/include /usr/local
          sudo cp -r stage/lib /usr/local
          sudo ldconfig

      - name: Build DuckDB (if cache miss)
        if: steps.cache-duckdb.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.5.4 https://github.com/duckdb/duckdb
          cd duckdb
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_UNIT_TESTS=OFF ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      # - name: Cache ONNX-runtime build
      #   uses: actions/cache@v4
      #   id: cache-onnxruntime
      #   with:
      #     path: |
      #       onnxruntime/build
      #       /usr/local/include/onnxruntime
      #       /usr/local/lib/libonnxruntime*
      #     key: ${{ runner.os }}-onnxruntime-${{ hashFiles('**/build.sh') }}
      #     restore-keys: |
      #       ${{ runner.os }}-onnxruntime-

      # - name: build ONNX-runtime (if cache miss)
      #   if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
      #   run: |
      #     git clone --recursive https://github.com/microsoft/onnxruntime
      #     cd onnxruntime
      #     git checkout v1.22.2
      #     export ORT_BUILD_WITH_CACHE=1
      #     ./build.sh --config Release --build_shared_lib --compile_no_warning_as_error --parallel --skip_tests --cmake_extra_defines CMAKE_INSTALL_PREFIX=/usr/local
      #     cd build/Linux/Release && sudo make install

      - name: build third_party
        run: |
          git clone --recursive https://github.com/nanomsg/nng
          cd nng
          git checkout v1.11
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

          cd ..
          git clone --recursive https://github.com/TA-Lib/ta-lib
          cd ta-lib
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

      # 检出代码
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 配置CMake并编译
      - name: Configure and build
        run: |
          git clone --recursive https://github.com/fmtlib/fmt service/third_party/fmt
          cd service/third_party/fmt
          git checkout 12.0.0
          cd -
          mkdir service/build && cd service/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_NODE_IO_LOGGING=ON -DENABLE_ASAN=ON -DSIMD_LEVEL=none
          cmake --build . --config Release -j$(nproc)

      # 显示缓存统计（验证加速效果）
      - name: Show ccache stats
        run: ccache -s

      # 上传构建产物供 test job 使用（二进制 + 配置模板，统一放在 service/build/ 下）
      - name: Prepare build artifact
        run: cp service/config.template.json service/build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            service/build/QuantService
            service/build/QuantService.debug
            service/build/config.template.json
            service/tools/
            service/test/
          compression-level: 5
          retention-days: 1

      # 上传第三方 so 供 test job 使用
      - name: List files to upload
        run: |
          echo "=== third_party/libs/unix ==="
          ls -la service/third_party/libs/unix/ || echo "DIR NOT FOUND"
          echo "=== /usr/local/lib ==="
          ls -la /usr/local/lib/libxgboost.* /usr/local/lib/libduckdb.so* /usr/local/lib/libnng.so* /usr/local/lib/libta_lib.* 2>&1 || true

      - name: Upload runtime libs
        uses: actions/upload-artifact@v4
        with:
          name: runtime-libs
          path: |
            /usr/local/lib/libxgboost.*
            /usr/local/lib/libduckdb.so*
            /usr/local/lib/libnng.so*
            /usr/local/lib/libta_lib.*
            service/third_party/libs/unix/libfastsptraderapi.so
            service/third_party/libs/unix/libfasttraderapi.so
            service/third_party/libs/unix/libsptraderapi.so
            service/third_party/libs/unix/libthostmduserapi_se.so
            service/third_party/libs/unix/libthosttraderapi_se.so
            service/third_party/libs/unix/libtraderapi.so
            service/third_party/libs/unix/libxfastmdapi.so
            service/third_party/libs/unix/libxmdapi.so
            service/third_party/libs/unix/libxtpquoteapi.so
            service/third_party/libs/unix/libxtptraderapi.so
            service/third_party/libs/unix/libonnxruntime.so
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
    steps:
      # 下载构建产物（二进制 + config 模板），download-artifact@v4 会放入 <artifact-name>/ 子目录，需提取到根目录
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Extract build artifact to workspace root
        run: |
          ls -la .
          cp -rf build-artifact/tools . 2>/dev/null || true
          cp -rf build-artifact/test . 2>/dev/null || true
          cp -rf build/QuantService . 2>/dev/null || true
          cp -rf build/QuantService.debug . 2>/dev/null || true
          cp -rf build/config.template.json . 2>/dev/null || true
          ls -la .
          rm -rf build-artifact

      # 下载第三方 so
      - name: Download runtime libs
        uses: actions/download-artifact@v4
        with:
          name: runtime-libs
          path: runtime-libs

      - name: List downloaded runtime libs
        run: |
          echo "=== runtime-libs root ==="
          find runtime-libs -type f -o -type l 2>/dev/null | head -50 || echo "DIR EMPTY"
          echo "=== /usr/local/lib (after copy) ==="

      - name: Install runtime libraries
        run: |
          # 将 artifact 中的 so 安装到 /usr/local/lib
          sudo cp -f runtime-libs/usr/local/lib/lib*.so /usr/local/lib/ 2>/dev/null || true
          # third_party/libs/unix 下的券商/交易 SDK
          sudo cp -f runtime-libs/home/runner/work/QuasarX/QuasarX/service/third_party/libs/unix/lib*.so /usr/local/lib/ 2>/dev/null || true
          sudo ls /usr/local/lib
          sudo ldconfig

      - name: Make service executable
        run: |
          chmod +x QuantService

      - name: Install runtime dependencies (system lib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpapi-dev libarmadillo-dev libmlpack-dev libssl-dev curl gdb
          sudo ldconfig

      - name: Install test dependencies (Python)
        run: |
          pip install pytest requests pyyaml \
            numpy pandas scipy matplotlib statsmodels \
            xgboost==3.3.0 PyEMD empyrical-reloaded

      - name: Create TLS certificates
        run: |
          echo "${{ secrets.SERVER_CRT }}" | base64 -d > server.crt
          echo "${{ secrets.SERVER_KEY }}" | base64 -d > server.key

      - name: Verify TLS certificates
        run: |
          echo "=== File sizes ==="
          ls -la server.crt server.key
          echo ""
          echo "=== PEM header check ==="
          echo "crt: $(head -1 server.crt)"
          echo "key: $(head -1 server.key)"
          echo ""
          echo "=== OpenSSL validate ==="
          openssl x509 -in server.crt -noout -subject -dates 2>&1 || echo "CRT INVALID"
          openssl rsa -in server.key -check -noout 2>&1 || echo "KEY INVALID"
          echo ""
          echo "=== Cert-Key modulus match ==="
          CERT_MOD=$(openssl x509 -in server.crt -noout -modulus 2>/dev/null | md5sum | awk '{print $1}')
          KEY_MOD=$(openssl rsa -in server.key -noout -modulus 2>/dev/null | md5sum | awk '{print $1}')
          echo "Cert: $CERT_MOD"
          echo "Key:  $KEY_MOD"
          if [ "$CERT_MOD" = "$KEY_MOD" ]; then echo "MATCH ✓"; else echo "MISMATCH ✗"; exit 1; fi

      # 从模板和 Secrets 生成 config.json（生命周期测试）和 tickflow.json（TickFlow 测试）
      - name: Generate configs from template
        run: |
          python3 -c "
          import json, os, sys

          with open('config.template.json') as f:
              template = json.load(f)

          def set_or_skip(obj, key, value, required=False):
              if value:
                  obj[key] = value
              elif required:
                  print(f'ERROR: required field \"{key}\" is empty', file=sys.stderr)
                  sys.exit(1)

          def fill_config(config):
              server = config.get('server', {})
              set_or_skip(server, 'user', os.environ.get('SERVER_USER'), required=True)
              set_or_skip(server, 'passwd', os.environ.get('SERVER_PASSWD'), required=True)
              set_or_skip(server, 'productID', os.environ.get('PRODUCT_ID'), required=True)
              set_or_skip(server, 'port', int(os.environ['SERVER_PORT']) if os.environ.get('SERVER_PORT') else None, required=True)
              set_or_skip(server, 'addr', os.environ.get('SERVER_ADDR'))
              set_or_skip(server, 'ssl', os.environ.get('SERVER_SSL'))
              if os.environ.get('SERVER_JWT_SECRET'):
                  server['jwt'] = os.environ['SERVER_JWT_SECRET']
              if os.environ.get('SERVER_LLM_KEY'):
                  server['llmkey'] = os.environ['SERVER_LLM_KEY']
              notice = server.get('notice', {})
              set_or_skip(notice, 'email', os.environ.get('NOTICE_EMAIL'))
              smtp = server.get('smtp', {})
              set_or_skip(smtp, 'addr', os.environ.get('SMTP_ADDR'))
              set_or_skip(smtp, 'auth', os.environ.get('SMTP_AUTH'))
              set_or_skip(smtp, 'mail', os.environ.get('SMTP_MAIL'))
              for ex in config.get('exchange', []):
                  if ex.get('name') == 'tickflow-quote':
                      set_or_skip(ex, 'passwd', os.environ.get('TICKFLOW_API_KEY'), required=True)
              for br in config.get('broker', []):
                  if os.environ.get('BROKER_COMMISSION'):
                      br['commission']['fee'] = float(os.environ['BROKER_COMMISSION'])
                  if os.environ.get('BROKER_MIN_COMMISSION'):
                      br['commission']['min'] = float(os.environ['BROKER_MIN_COMMISSION'])
                  if os.environ.get('BROKER_STAMP'):
                      br['commission']['stamp'] = float(os.environ['BROKER_STAMP'])
              capital_risk = config.get('risk', {}).get('capitalRisk', {})
              if os.environ.get('INITIAL_CAPITAL'):
                  capital_risk['initialCapital'] = float(os.environ['INITIAL_CAPITAL'])

          # config.json: 使用全部 exchange（生命周期测试用）
          import copy
          config = copy.deepcopy(template)
          fill_config(config)
          with open('config.json', 'w') as f:
              json.dump(config, f, indent=4)
          print('config.json generated successfully')

          # tickflow.json: 仅保留 tickflow exchange（TickFlow 测试用）
          tickflow_config = copy.deepcopy(template)
          tickflow_config['exchange'] = [
              ex for ex in tickflow_config.get('exchange', [])
              if ex.get('name') == 'tickflow-quote'
          ]
          tickflow_config['server']['default']['exchange'] = [
              ex['name'] for ex in tickflow_config['exchange']
          ]
          fill_config(tickflow_config)
          with open('tickflow.json', 'w') as f:
              json.dump(tickflow_config, f, indent=4)
          print('tickflow.json generated successfully')

          # stock_hist_sim.json: 仅保留历史回测 exchange（回测测试用）
          stock_config = copy.deepcopy(template)
          stock_config['exchange'] = [
              ex for ex in stock_config.get('exchange', [])
              if ex.get('api') in ('stock_hist_sim', 'etf_hist_sim')
          ]
          stock_config['server']['default']['exchange'] = [
              ex['name'] for ex in stock_config['exchange']
          ]
          fill_config(stock_config)
          with open('stock_hist_sim.json', 'w') as f:
              json.dump(stock_config, f, indent=4)
          print('stock_hist_sim.json generated successfully')
          "
        env:
          # 必填
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWD: ${{ secrets.SERVER_PASSWD }}
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          # 可选
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          SERVER_SSL: ${{ secrets.SERVER_SSL }}
          SERVER_JWT_SECRET: ${{ secrets.SERVER_JWT_SECRET }}
          SERVER_LLM_KEY: ${{ secrets.SERVER_LLM_KEY }}
          NOTICE_EMAIL: ${{ secrets.NOTICE_EMAIL }}
          SMTP_ADDR: ${{ secrets.SMTP_ADDR }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_MAIL: ${{ secrets.SMTP_MAIL }}

      # === 阶段 1: 服务生命周期测试（启动 + 稳定 + 优雅退出）===
      - name: Start service (lifecycle test)
        id: start_service
        run: |
          # 允许生成 core dump 以便崩溃时获取堆栈
          ulimit -c unlimited
          echo "core" | sudo tee /proc/sys/kernel/core_pattern 2>/dev/null || true
          
          # 启动前诊断
          echo "=== Pre-start diagnostics ==="
          echo "Working directory: $(pwd)"
          echo "Binary: $(test -f QuantService && echo 'EXISTS' || echo 'MISSING')"
          echo "TLS cert: $(test -f server.crt && echo 'EXISTS' || echo 'MISSING')"
          echo "Missing libraries:"
          ldd QuantService 2>/dev/null | grep "not found" || echo "  (none)"
          echo "================================="
          
          # 后台启动服务
          ./QuantService config.json > service_lifecycle.log 2>&1 &
          SERVICE_PID=$!
          echo "pid=$SERVICE_PID" >> $GITHUB_OUTPUT
          echo "Service started with PID $SERVICE_PID"

          # 等待 60 秒让服务充分初始化
          echo "Waiting 60s for service initialization..."
          sleep 60

          # 检查进程是否还在
          if ! kill -0 "$SERVICE_PID" 2>/dev/null; then
            echo "========================================="
            echo "SERVICE CRASHED DURING INITIALIZATION"
            echo "========================================="
            echo ""
            echo "=== Full log output ==="
            cat service_lifecycle.log || echo "(log empty)"
            echo ""

            # === 崩溃分析 ===
            echo "=== Searching for core dump ==="
            CORE_FILE=""
            for path in /tmp/core.* ./core.* /var/lib/systemd/coredump/core* core; do
              for f in $path; do
                if [ -f "$f" ]; then
                  CORE_FILE="$f"
                  echo "Found core dump: $CORE_FILE"
                  break 2
                fi
              done
            done

            if [ -n "$CORE_FILE" ]; then
              echo ""
              echo "=== GDB Analysis (backtrace + threads) ==="
              gdb -batch \
                -ex "file ./QuantService" \
                -ex "symbol-file ./QuantService.debug" \
                -ex "set pagination off" \
                -ex "bt full" \
                -ex "echo \n=== Thread list ===\n" \
                -ex "info threads" \
                -c "$CORE_FILE" 2>&1 | head -300
            else
              echo "No core dump found."
              echo "Current core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || echo 'unknown')"
              echo "ulimit -c: $(ulimit -c)"
            fi

            echo ""
            echo "========================================="
            echo "CRASH ANALYSIS COMPLETE"
            echo "========================================="
            exit 1
          fi

          echo "Service (PID $SERVICE_PID) is still running after 60s initialization"

      - name: Stop service (graceful shutdown test)
        id: stop_service
        if: success()
        run: |
          SERVICE_PID=${{ steps.start_service.outputs.pid }}
          echo "Sending graceful shutdown request to service (PID $SERVICE_PID)..."

          # 1. 先 login 获取 token
          LOGIN_RESP=$(curl -sk -X POST "https://localhost:${{ env.SERVER_PORT }}/v0/user/login" \
            -H "Content-Type: application/json" \
            -d '{"name":"${{ secrets.SERVER_USER }}","pwd":"${{ secrets.SERVER_PASSWD }}"}')
          echo "Login response: $LOGIN_RESP"
          TOKEN=$(echo "$LOGIN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['tk'])")
          echo "Token obtained: ${TOKEN:0:8}..."

          # 2. 携带 token 发送退出请求
          EXIT_RESP=$(curl -sk -X POST "https://localhost:${{ env.SERVER_PORT }}/v0/exit" \
            -H "Authorization: $TOKEN")
          echo "Exit response: $EXIT_RESP"

          # 3. 等待服务退出
          for i in $(seq 1 10); do
            if ! kill -0 "$SERVICE_PID" 2>/dev/null; then
              echo "Service exited gracefully after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Graceful shutdown timeout, sending SIGKILL to PID $SERVICE_PID"
          kill -9 "$SERVICE_PID" 2>/dev/null || true
          echo "Service forced to terminate"
          cat service_lifecycle.log || true
          exit 1

      # === 阶段 2: 回测功能测试（stock_hist_sim 模式）===
      - name: Run backtest tests
        id: test
        timeout-minutes: 10
        run: |
          # 严格模式：命令失败立即退出，捕获未定义变量和 pipeline 失败
          set -euo pipefail

          # 注册清理 trap：脚本退出时强制 kill 服务，避免残留进程 hang 后续 stage
          cleanup() {
            echo "=== Cleanup: stopping service (PID=${TEST_PID:-unknown}) ==="
            # 诊断：服务退出前的内存状态
            if [ -n "${TEST_PID:-}" ] && kill -0 "$TEST_PID" 2>/dev/null; then
              echo "Service still alive, RSS memory:"
              ps -o pid,rss,vsz,%mem,comm -p "$TEST_PID" 2>/dev/null || true
            else
              echo "Service already dead (PID=${TEST_PID:-unknown})"
              # 检查是否被 OOM killer 杀掉
              sudo dmesg -T 2>/dev/null | grep -i "oom\|killed process" | tail -5 || true
            fi
            curl -sk -X POST https://localhost:${{ env.SERVER_PORT }}/v0/exit 2>/dev/null || true
            sleep 1
            [ -n "${TEST_PID:-}" ] && kill -9 "$TEST_PID" 2>/dev/null || true
            echo "=== Cleanup done ==="
          }
          trap cleanup EXIT

          nohup ./QuantService stock_hist_sim.json > service_test.log 2>&1 &
          TEST_PID=$!
          echo "Test service PID: $TEST_PID"

          # 等待服务就绪（最多 30s）
          for i in $(seq 1 30); do
            if curl -sk https://localhost:${{ env.SERVER_PORT }}/v0/server/status >/dev/null 2>&1; then
              echo "Test service ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Service failed to start within 30s"
              cat service_test.log || true
              exit 1
            fi
            sleep 1
          done

          # 进入 test 目录（artifact 提取后 test/ 在 repo root 下）
          cd test

          # 生成测试数据
          python testcases/generate_test_data.py
          python testcases/node_test_data/generate_node_data.py
          python testcases/ai_test_data/generate_xgb_trivial.py

          # 说明：当前 CI 构建为 Release 模式（cmake -DCMAKE_BUILD_TYPE=Release），
          # `_DEBUG` 宏未定义 → `/strategy/simulate/bar` 路由和 SimulateBarHandler 未注册。
          # test_decision.py 中调用 simulate_bar() 的用例在 Release 下会被 pytest.skip
          # （simulate_bar 工具函数返回 {"status": "error", "error": "HTTP 404: ..."}，
          #  调用方的 skip 判断会触发），这是预期行为。
          # 若需在 CI 验证 ManualTiming 决策 / 日终绩效指标，需改用 Debug 构建或为
          # test_decision.py 注入测试数据（绕过 simulate/bar 端点）。
          # 运行测试（--maxfail=1 让 pytest 在首个失败时停止，节省 CI 时间）
          python run_tests.py --mode stock_hist_sim --no-service --maxfail 1
          TEST_EXIT_CODE=$?
          cd ..

          # 上传 stock_hist_sim.json 用于诊断
          echo "=== stock_hist_sim.json content ==="
          cat stock_hist_sim.json
          echo "==================================="

          exit $TEST_EXIT_CODE

      # === 阶段 2.6: TickFlow 实时行情测试（tickflow 模式）===
      # 用 tickflow.json 重启服务（已由 Generate configs 步骤用 TICKFLOW_API_KEY 填充 passwd），
      # 跑 test_modes.json 的 tickflow tests（test_strategy/test_strategy_log/test_sectorquote/
      # test_tick_record/test_data/test_shibor）。test_strategy 中依赖 tickflow 行情的用例
