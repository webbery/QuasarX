# @see https://www.electron.build/configuration/configuration
---
appId: br.heliomarpm.elvvqs
productName: Electron VueVite - Quick Start
copyright: Copyright © 2023 — ${author}
artifactName: ${name}_Setup_v${version}_${os}-${arch}.${ext}
asar: true

portable: 
  artifactName: ${name}_Portable-v${version}_${os}-${arch}.${ext}

directories: 
  buildResources: src/assets/icons
  output: dist

files:
  - build

extraResources:
  - from: skills
    to: skills
    filter:
      - "**/*.md"

mac:
  category: public.app-category.utilities

win:
  target: 
    - nsis
    - portable
  
linux:
  category: Utility
  target:
    - AppImage
    - deb
    # rpm 目标已临时关闭：CI runner 镜像（ubuntu-latest）自带 rpm 4.18，
    # electron-builder 25.1.8 + fpm 1.9.3 生成的 SPEC 在该版本 rpmbuild 下退出码 1。
    # 仓库侧构建配置自 2026-07-08 未变动，属于运行环境漂移导致的失败。
    # 恢复方式（任选其一）：
    #   1) workflow 固定 runs-on: ubuntu-22.04（历史可用镜像）
    #   2) 在 runner 上显式安装兼容版本的 rpm 工具链
    #   3) 去掉 productName 中的空格后重新开启（fpm 的 %files 为空白分隔，空格路径会被拆开）
    # - rpm
    # - freebsd
  