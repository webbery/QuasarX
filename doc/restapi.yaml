    #  ══════════════ XGBoost Schemas ══════════════

    XGBoostTrainRequest:
      type: object
      required: [action, script, label]
      properties:
        action:
          type: string
          enum: [train]
        script:
          type: string
          description: 策略图 JSON 字符串
        label:
          type: object
          required: [source]
          properties:
            source:
              type: string
            period:
              type: integer
              default: 5
            type:
              type: string
              enum: [classification, regression]
              default: classification
            threshold:
              type: number
              default: 0.0
        objective:
          type: string
          enum: [binary:logistic, multi:softprob, reg:squarederror]
          default: binary:logistic
        num_class:
          type: integer
          default: 2
        test_ratio:
          type: number
          default: 0.2
          description: |
            留出段比例（单次切分时）。留出段保持完整的名义跨度，
            不参与训练，也不参与任何超参/阈值选择。
        gap_bars:
          type: integer
          default: 0
          description: |
            单次切分时，从训练侧那一段的尾部挖掉的间隔长度（唯一交易日数）。
            0 表示取 `label.period` —— 标签是 label.period 根 bar 的前瞻收益时，
            这是保证训练样本的标签窗口不伸进验证/测试段的最小间隔。

            与 `cv.gap.bars` 同一口径。CV 模式下本字段不生效，
            CV 的间隔由 `cv.gap` 控制。
        params:
          type: object
        py_env:
          type: string
        csv_path:
          type: string
          description: 预收集的特征 CSV 路径（跳过数据收集阶段）
        cv:
          $ref: "#/components/schemas/CVConfig"

    XGBoostShapRequest:
      type: object
      required: [action, model_id]
      properties:
        action:
          type: string
          enum: [shap]
        model_id:
          type: integer

    XGBoostDeleteRequest:
      type: object
      required: [action, model_id]
      properties:
        action:
          type: string
          enum: [delete]
        model_id:
          type: integer

    XGBoostUpdateMetaRequest:
      type: object
      required: [action, model_path, fields]
      description: |
        修改磁盘上 .meta.json 的白名单字段。仅允许 version / display_name / description，
        其他字段会被忽略。不动模型 .json 文件本身，避免破坏 XGBoostNode.modelFile 引用。
        路径校验：model_path 必须在 `{dbPath}/models/experiments/` 或 `{dbPath}/models/production/` 下，
        否则返回 403。
      properties:
        action:
          type: string
          enum: [update_meta]
        model_path:
          type: string
          description: |
            模型文件路径，可传绝对路径或相对 `{dbPath}/models/` 的逻辑路径
            （如 `production/CTA_v16-CTA_v16.json` 或 `experiments/test_20260815.json`）
          example: production/CTA_v16-CTA_v16.json
        fields:
          type: object
          description: 要修改的字段（仅白名单生效），其他字段被忽略
          properties:
            version:
              type: string
              description: 语义版本号（如 v17 / v3.0.1）
              example: v17
            display_name:
              type: string
              description: 模型友好名称（默认等于 strategyName-xgbLabel）
              example: CTA_v16_baseline
            description:
              type: string
              description: 模型用途/特性描述

    XGBoostUpdateMetaResponse:
      type: object
      description: 修改 meta 后的响应
      properties:
        status:
          type: string
          enum: [ok]
        path:
          type: string
          description: 实际写入的 .meta.json 绝对路径
        meta:
          type: object
          description: 修改后的完整 meta.json 内容（含自动写入的 updated_at）

    LeakageChecks:
      type: object
      description: |
        折间泄漏的实测统计。这些值是**算出来的**，不是写死的字面量：
        `overlap_rows` 逐段统计"训练样本的前瞻标签窗口伸进下一段"的样本行数。
        gap >= label.period 时它必须为 0；不为 0 说明间隔不够。
      properties:
        gap_ge_label_period:
          type: boolean
          description: gap >= label.period
        gap_dates:
          type: integer
          description: 实际生效的段间隔离长度（唯一交易日数）
        gap_applied:
          type: boolean
          description: 是否真的留了间隔（缺日期列时为 false）
        gap_shrunk:
          type: boolean
          description: |
            间隔是否因数据量不够而被压缩（压缩后可能仍有泄漏，
            由 overlap_rows 如实报出）
        overlap_rows:
          type: integer
          nullable: true
          description: |
            训练样本的前瞻标签窗口伸进下一段的样本行数。必须为 0。
            无日期列、无法按日期留间隔时为 null（不假装通过）。
        oof_rows:
          type: integer

    CVConfig:
      type: object
      description: |
        Walk-forward 交叉验证配置。传入 `cv.enabled=true` 时，训练流程切换为
        walk-forward OOF 评估 + 全量 refit；不传或 `enabled=false` 时走单次切分。

        单位约定：`train_len` / `oos_len` / `gap.bars` / `step` 都是**唯一交易日期数**，
        不是样本行数。多标的 matrix 模式下，同一天所有标的落在同一段。

        Phase 1 约束：`scheme` 仅支持 `walk_forward`，`final_model` 仅支持 `refit_full`。
        非法值返回 400。
      properties:
        enabled:
          type: boolean
          default: false
          description: 是否启用 CV
        scheme:
          type: string
          enum: [walk_forward]
          default: walk_forward
          description: 折计划方案（Phase 1 仅支持 walk_forward）
        n_folds:
          type: integer
          default: 5
          description: 最大折数；实际折数由可用数据决定
        walk_forward:
          type: object
          properties:
            train_len:
              type: integer
              description: 训练窗口长度（唯一日期数）
              example: 504
            oos_len:
              type: integer
              description: 每折 OOS 长度（唯一日期数）
              example: 63
            step:
              type: integer
              description: |
                折间步长（唯一日期数）。不传时按 n_folds 在可用数据上均分；
                算出来小于 oos_len 时会抬到 oos_len，保证 OOF 不重叠。
            window_mode:
              type: string
              enum: [rolling, anchored]
              default: rolling
              description: rolling=固定窗口滚动；anchored=从第 0 根开始
            inner_val_ratio:
              type: number
              default: 0.15
              description: 折内 early stopping 用的验证集比例；0 表示不用
        gap:
          type: object
          description: |
            训练集与 OOS 折之间的空隙，防止标签前瞻窗口泄漏。
            不传时默认等于 `label.period`。
          properties:
            mode:
              type: string
              enum: [label, nw]
              default: label
              description: |
                label=按 label.period；nw=按 max(label.period, nw.lag)
            bars:
              type: integer
              description: 显式指定 gap 长度（唯一日期数）；优先级高于 mode
        nw:
          type: object
          description: Newey-West HAC t 值的滞后阶数配置
          properties:
            lag:
              type: integer
              default: 0
              description: |
                NW lag；0=自动取 max(10, 2 * label.period)。
                用于 OOF IC 的显著性检验，不影响切分。
        final_model:
          type: string
          enum: [refit_full]
          default: refit_full
          description: 最终模型策略（Phase 1 仅支持 refit_full）

    CVResult:
      type: object
      description: |
        Walk-forward CV 结果。仅在 `cv.enabled=true` 时出现在响应中。
      properties:
        enabled:
          type: boolean
          example: true
        scheme:
          type: string
          example: walk_forward
        n_folds_requested:
          type: integer
          description: 请求的最大折数
        n_folds:
          type: integer
          description: 实际成功的折数
        window_mode:
          type: string
          example: rolling
        train_len:
          type: integer
        oos_len:
          type: integer
        step:
          type: integer
          description: 实际使用的折间步长
        gap_bars:
          type: integer
          description: 实际使用的 gap（可能因抬升到 label.period 而变大）
        gap_mode:
          type: string
          example: label
        nw_lag:
          type: integer
          description: 实际使用的 NW lag
        inner_val_ratio:
          type: number
        final_model:
          type: string
          example: refit_full
        final_rounds:
          type: integer
          description: 全量重训使用的轮数（各折 best_rounds 的中位数）
        n_oof:
          type: integer
          description: OOF 总样本数
        folds:
          type: array
          items:
            $ref: "#/components/schemas/CVFold"
        oof_metrics:
          type: object
          additionalProperties: { type: number }
          description: OOF 汇总指标（分类：accuracy/f1/logloss/...；回归：rmse/mae/r2）
        oof_ic:
          $ref: "#/components/schemas/CVIC"
        leakage_checks:
          $ref: "#/components/schemas/LeakageChecks"

    CVFold:
      type: object
      properties:
        index:
          type: integer
        train_start:
          type: string
          format: date
        train_end:
          type: string
          format: date
        oos_start:
          type: string
          format: date
        oos_end:
          type: string
          format: date
        n_train:
          type: integer
        n_inner_val:
          type: integer
          description: 折内 early stopping 用的验证集样本数
        n_oos:
          type: integer
        best_rounds:
          type: integer
        overlap_rows:
          type: integer
          description: |
            本折里训练样本的前瞻标签窗口伸进 OOS 的样本行数。
            gap >= label.period 时必须为 0。
        metrics:
          type: object
          additionalProperties: { type: number }
        ic:
          $ref: "#/components/schemas/CVIC"

    CVIC:
      type: object
      description: |
        Spearman IC 指标。优先截面 IC（每天一个 IC 值，再对时间序列做 NW t）；
        横截面样本不足时退化为整段时序 IC。
      properties:
        kind:
          type: string
          enum: [cross_sectional, time_series]
        mean:
          type: number
          nullable: true
        std:
          type: number
          nullable: true
        ir:
          type: number
          nullable: true
          description: mean / std
        nw_t:
          type: number
          nullable: true
          description: Newey-West t 值
        p_value:
          type: number
          nullable: true
        days:
          type: integer
          description: 有效天数
        positive_ratio:
          type: number
          nullable: true

    XGBoostOptimizeRequest:
      type: object
      required: [action, feature_cache, fast_backtest_strategy]
      description: |
        Optuna 超参数自动优化 + 快速回测评估。

        工作流：
          1. 前端先调 POST /v0/ml?action=collect 拿到 csv_path
          2. POST /v0/ml?action=optimize 把 csv_path 作为 feature_cache 传入
          3. 后端启动后台线程跑 xgboost_optimize.py，每个 trial：
             a. Python xgboost 训练（只用训练段）→ 保存到 experiments/optimize_fast_{ts}/
             b. POST http://localhost:19107/v0/backtest (feature_cache + model_path)
             c. 在**选择窗口**上重算指标作为 Optuna objective
          4. 对各 trial 的 DEV 显著性做 BH-FDR 校正
          5. 搜索结束后对选中的 trial 在留出段评一次
          6. SSE 流式推送 trial/value/result 事件
          7. GET /v0/ml?action=train_status&session_id=... 读最终结果

        三段式切分（按唯一交易日，单位是交易日）
        ----------------------------------------
          TRAIN   = [0, T-gap)      训练模型
          DEV     = [T, V-gap)      选超参（objective 只看这段）
          HOLDOUT = [V, N)          最终只评一次，不参与任何选择

        留出段是唯一无偏的读数；`selection.selection_bias` 给出
        "选超参这件事本身乐观了多少"（= best_dev_value − holdout_value）。

        optimize_metric 字段映射（Python 侧）：
          sharpe        → "sharp"
          total_return  → "total_return"
          annual_return → "annual_return"
          max_drawdown  → "max_drawdown"
          win_rate      → "win_rate"
          calmar_ratio  → "calmar_ratio"

        注意：服务端的 `max_drawdown` 是**正数**（回撤幅度）。Python 侧在
        计算 objective 时会取负号统一成"越大越好"，所以 trial 的 `value`
        对 max_drawdown 而言是负的回撤；trial 的 `summary.max_drawdown`
        仍是正的原值。
      properties:
        action:
          type: string
          enum: [optimize]
        feature_cache:
          type: string
          description: 特征缓存 CSV 路径（POST /v0/ml?action=collect 产出）
          example: /tmp/xgb_data_xxx.csv
        fast_backtest_strategy:
          type: string
          description: 回测策略 JSON（含 XGBoost 节点，modelFile 会被脚本动态改写）
        label:
          type: object
          description: 标签配置
          properties:
            source: { type: string, example: "sz.800001.close" }
            period: { type: integer, default: 5 }
            type: { type: string, enum: [classification, regression], default: classification }
            shape: { type: string, enum: [vector, matrix], default: matrix }
            vol_k: { type: number, default: 0.5 }
        n_trials:
          type: integer
          default: 20
          description: Optuna 试验次数
        optimize_metric:
          type: string
          enum: [sharpe, total_return, annual_return, max_drawdown, win_rate, calmar_ratio]
          default: sharpe
        select_window:
          type: string
          enum: [val, full]
          default: val
          description: |
            选超参时用哪段数据：
            - `val`（默认）：只用 DEV 段（`val_ratio` 那段）。留出段不参与选择。
            - `full`：整段历史（旧行为）。此时测试期参与了超参选择，
              报出的指标是乐观的；仅用于复现历史数字，不要据此下结论。
        fdr_alpha:
          type: number
          default: 0.10
          description: |
            BH-FDR 显著性水平。对各 trial 的 DEV 窗口日均收益做 Newey-West
            t 检验后对 p 值做 BH 校正（口径与特征门禁一致）。必须在 (0,1) 内，
            否则返回 400。
        select_by:
          type: string
          enum: [dev_metric, q]
          default: dev_metric
          description: |
            选优口径：
            - `dev_metric`（默认）：取 DEV 段指标最高的 trial。
            - `q`：只在通过 BH-FDR（`q <= fdr_alpha`）的 trial 里取指标最高的；
              一个都没通过时退回 `dev_metric` 并给出告警。
        gap_bars:
          type: integer
          default: 0
          description: |
            段间隔离长度（唯一交易日数），从训练侧那一段的尾部挖掉。
            0 表示取 `label.period`。
        param_domains:
          type: string
          description: 参数搜索域 JSON 字符串
          example: '{"learning_rate":{"min":0.005,"max":0.3,"log":true}}'
        objective:
          type: string
          default: multi:softprob
        num_class:
          type: integer
          default: 3
        test_ratio:
          type: number
          default: 0.2
          description: 留出段（HOLDOUT）比例，只用于最终评估，不参与选择
        val_ratio:
          type: number
          default: 0.15
          description: 选择段（DEV）比例，用于挑选超参；数据量 < 1000 时退化为 0
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        frequency:
          type: string
          default: 1d
        auth_token:
          type: string
          description: 透传给 Python 脚本（访问 /v0/backtest 时用）
        py_env:
          type: string
          description: Python 解释器环境名（可选）

    OptimizeSelection:
      type: object
      description: |
        参数搜索的选优口径与留出集评估结果。出现在 action=optimize 的
        最终结果里。
      properties:
        window:
          type: string
          enum: [val, full]
          description: 实际生效的选择窗口（`full` 可能来自无 DEV 段时的退化）
        metric:
          type: string
          description: 优化目标
        select_by:
          type: string
          enum: [dev_metric, q]
        fdr_alpha:
          type: number
        n_trials_scored:
          type: integer
          description: 成功评分的 trial 数
        n_trials_q_pass:
          type: integer
          description: 通过 BH-FDR 校正的 trial 数
        dev_start:
          type: string
          format: date
          nullable: true
          description: 选择段起始日（window=full 时为 null）
        dev_end:
          type: string
          format: date
          nullable: true
        holdout_start:
          type: string
          format: date
          nullable: true
          description: 留出段起始日
        holdout_end:
          type: string
          format: date
          nullable: true
        gap_dates:
          type: integer
          description: 实际生效的段间隔离长度（唯一交易日数）
        best_dev_value:
          type: number
          nullable: true
          description: 选中 trial 在选择段上的指标
        holdout_value:
          type: number
          nullable: true
          description: 选中 trial 在留出段上的指标（只评一次）
        selection_bias:
          type: number
          nullable: true
          description: |
            best_dev_value − holdout_value。直接量化"挑超参这件事本身
            乐观了多少"。显著为正说明选择段上的指标不可直接外推。
        optuna_best_trial_number:
          type: integer
          description: Optuna 自身记账的最优 trial（可能与最终选中的不同）

    XGBoostTrainResponse:
      type: object
      properties:
        model_id: { type: integer }
        model_path: { type: string }
        best_iteration: { type: integer }
        n_train: { type: integer }
        n_val: { type: integer }
        n_test: { type: integer }
        n_features: { type: integer }
        features:
          type: array
          items: { type: string }
        classes:
          type: array
          items: { type: integer }
          nullable: true
          description: 分类的全局类别编码（回归时为 null）
        split_mode:
          type: string
          enum: [date, row, cv_walk_forward]
          description: |
            切分模式：date=按唯一日期切分；row=按行切分（无日期列时退化）；
            cv_walk_forward=walk-forward CV
        test_date_start:
          type: string
          format: date
        test_date_end:
          type: string
          format: date
        learning_curve:
          type: array
          items:
            type: object
            properties:
              iteration: { type: integer }
              train_loss: { type: number }
              eval_loss: { type: number }
        feature_importance:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              gain: { type: number }
              weight: { type: number }
              cover: { type: number }
        eval_metrics:
          type: object
          additionalProperties: { type: number }
          description: |
            单次切分：测试集指标；CV：OOF 汇总指标
        predictions:
          type: array
          items:
            type: object
            properties:
              actual: { type: number }
              predicted: { type: number }
              pred_class: { type: integer }
        X_test:
          type: array
          items:
            type: array
            items: { type: number }
          description: 测试集特征（SHAP 用）
        X_test_dates:
          type: array
          items: { type: string }
          description: 测试集日期（与 X_test 行对齐）
        cv:
          $ref: "#/components/schemas/CVResult"
          description: CV 结果（仅 cv.enabled=true 时存在）
        leakage_checks:
          $ref: "#/components/schemas/LeakageChecks"
          description: |
            折间泄漏的实测统计（单次切分路径）。CV 路径下见 `cv.leakage_checks`。

    XGBoostShapResponse:
      type: object
      properties:
        model_id: { type: integer }
        features:
          type: array
          items: { type: string }
        shap:
          type: array
          items:
            type: array
            items: { type: number }
        base_value:
          type: array
          items: { type: number }
        n_samples: { type: integer }

    XGBoostDeleteResponse:
      type: object
      properties:
        message: { type: string, example: "deleted" }

    XGBoostOptimizeSubmitResponse:
      type: object
      description: action=optimize 提交后立即返回的响应（session_id 用于后续 SSE/poll）
      properties:
        session_id:
          type: string
          example: xgb_opt_1234567890
        status:
          type: string
          enum: [running]
        n_trials:
          type: integer
        optimize_metric:
          type: string

    XGBoostScreenRequest:
      type: object
      description: |
        特征筛选门禁（Step 1）。只需一份特征缓存 CSV，不需要策略图或行情源。
        统计口径由 service/tools/feature_screen.py 统一实现。
      required: [action, csv_path]
      properties:
        action:
          type: string
          enum: [screen]
        csv_path:
          type: string
          description: 特征缓存 CSV，来自 /v0/ml action=collect 的 csv_path
        label:
          type: object
          description: |
            `period` 决定前瞻期（未显式传 primary_horizon 时作为主 horizon）。
            `vol_k` / `sigma_mode` 只影响三分类训练，不改变 rank IC，
            服务端仅记录在结果的 label 字段里用于对账。
          properties:
            period: { type: integer, default: 5, minimum: 1, maximum: 250 }
            vol_k: { type: number, default: 0.34 }
            sigma_mode:
              type: string
              enum: [expanding, full]
              default: expanding
        primary_horizon:
          type: integer
          default: 5
          minimum: 1
          maximum: 250
          description: 选择与 top-k 使用的主 horizon；缺省取 label.period
        horizons:
          type: array
          items: { type: integer }
          default: [1, 5, 10, 20]
          description: 仅控制 IC 衰减曲线；主 horizon 会自动并入
        entry:
          type: string
          enum: [close, next_open]
          default: close
        ohlcv_cache:
          type: string
          description: entry=next_open 时必填；宽表/长表 CSV 或每标的 CSV 目录
        dev_end:
          type: string
          format: date
          default: '2025-10-28'
        test_start:
          type: string
          format: date
          default: '2025-10-29'
        n_folds: { type: integer, default: 5, minimum: 2, maximum: 50 }
        min_names: { type: integer, default: 15, minimum: 2 }
        nw_lag:
          type: integer
          default: 0
          description: 0 = max(10, 2*primary_horizon)
        rules:
          type: object
          properties:
            min_ic: { type: number, default: 0.02, minimum: 0 }
            min_t: { type: number, default: 2.5, minimum: 0 }
            min_sign_folds: { type: integer, default: 4 }
            fdr_q: { type: number, default: 0.10, exclusiveMinimum: 0, maximum: 1 }
            min_coverage: { type: number, default: 0.50, minimum: 0, maximum: 1 }
            gate_topk: { type: integer, default: 5, minimum: 1 }
        trial_count:
          type: integer
          default: 0
          description: 历史累计尝试过的特征数，用于 BH FDR 的 M；0 = 用本次候选数
        features:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: 只筛这些特征；空 = 全部
        incremental_base:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: 增量 IC 的回归基准特征；空 = 用本次全部特征
        lag_shifts:
          type: array
          items: { type: integer }
          default: [-2, -1, 0, 1, 2]
          description: 滞后敏感性诊断的平移步数；k>0 用更旧的数据
        no_test: { type: boolean, default: false }
        no_incremental: { type: boolean, default: false }
        no_lag_sensitivity: { type: boolean, default: false }
        winsorize: { type: number, default: 0.01 }
        vol_scale: { type: boolean, default: false }
        limit_eps: { type: number, default: 0.002 }
        min_turnover: { type: number, default: 0.0 }
        py_env:
          type: string
          description: |
            Python 解释器或 config.json 里的环境名。服务默认 python3 不一定
            装有 pandas，建议显式指定（同 action=train 的 py_env）。

    XGBoostScreenSubmitResponse:
      type: object
      description: action=screen 提交后立即返回（session_id 用于 SSE / train_status）
      properties:
        session_id:
          type: string
          example: screen_1761123456789012345
        status:
          type: string
          enum: [started, running]
        message:
          type: string
          description: 已有其他 ML 会话在跑时返回 "another ML session is running"

    XGBoostScreenResult:
      type: object
      description: |
        action=screen 完成后的结果，通过
        `GET /v0/ml?action=train_status&session_id=...` 获取
        （完整逐特征明细用 `GET ?action=screen_result&run_id=...`）。
      properties:
        status:
          type: string
          enum: [done, error]
        session_id: { type: string }
        run_id:
          type: string
          example: screen_20261021_190500_1234
        out_dir:
          type: string
          description: 结果目录（绝对路径）
        files:
          type: object
          properties:
            json: { type: string }
            csv: { type: string }
            md: { type: string }
          description: 不包含 PNG——服务端固定 --no-plot，由前端用 JSON 绘图
        summary:
          type: object
          properties:
            n_features: { type: integer }
            n_tier_a: { type: integer }
            n_tier_b: { type: integer }
            m_tests: { type: integer }
            bonferroni_t: { type: number }
            dev_days: { type: integer }
            test_days: { type: integer }
            primary_horizon: { type: integer }
            lag_sensitivity: { type: boolean }
            plots: { type: boolean, description: 恒为 false（服务端 --no-plot） }
        label:
          type: object
          description: 回显 label.period / vol_k / sigma_mode，便于与训练配置对账
          properties:
            period: { type: integer }
            vol_k: { type: number }
            sigma_mode: { type: string }
        meta:
          type: object
          additionalProperties: true
          description: 与结果 JSON 的 meta 相同（日期切分、规则、lag_shifts 等）
        error:
          type: string
          description: status=error 时的失败原因

    XGBoostScreenDetail:
      type: object
      description: |
        `GET ?action=screen_result&run_id=...` 返回的完整结果，结构为
        `{meta: {...}, features: {<name>: {dev, test, incremental, decay, lag,
        q_value, selection}}}`。字段与 feature_screen.json 一致，此处不展开
        （随筛选维度变化），前端按需读取。
      additionalProperties: true

    XGBoostListResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              filename: { type: string }
              meta:
                type: object
                nullable: true
                additionalProperties: true
        production:
          type: object
          nullable: true
          properties:
            path: { type: string }
            filename: { type: string }
            meta:
              type: object
              nullable: true
              additionalProperties: true

    XGBoostOptimizeResult:
      type: object
      description: |
        action=optimize 完成后的最终结果（通过 GET /v0/ml?action=train_status 获取）。
        与 xgboost_optimize.py 的 {"type":"result"} 输出对齐。
      properties:
        best_params:
          type: object
          additionalProperties: true
          description: 最优超参
        best_value:
          type: number
          description: 最优 optimize_metric 值
        best_trial_number:
          type: integer
        best_model:
          type: string
          description: 最优模型路径（experiments/optimize_fast_{ts}/best.json）
        n_trials:
          type: integer
        n_completed:
          type: integer
        trials:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              value: { type: number }
              best: { type: number }
              params:
                type: object
                additionalProperties: true
              duration_ms: { type: integer }
              status: { type: string, enum: [ok, failed] }
              summary:
                type: object
                additionalProperties: true
              dev_value:
                type: number
                nullable: true
                description: 该 trial 在选择段（DEV）上的指标
              dev_n_days:
                type: integer
                description: 选择段内的有效交易日数
              dev_t:
                type: number
                nullable: true
                description: 选择段日均收益的 Newey-West t 值
              dev_p:
                type: number
                nullable: true
                description: 对应的双侧 p 值
              dev_q:
                type: number
                nullable: true
                description: BH-FDR 校正后的 q 值
              q_pass:
                type: boolean
                description: 是否通过 BH-FDR 校正（q <= fdr_alpha）
              holdout_value:
                type: number
                nullable: true
                description: |
                  该 trial 在留出段上的指标。留出段不参与选择，
                  这里只是把每个 trial 的留出表现都记下来备查。
        importance:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              importance: { type: number }
        optimization_duration_ms:
          type: integer
        metric:
          type: string
        output_dir:
          type: string
        selection:
          $ref: "#/components/schemas/OptimizeSelection"
          description: 选优口径与留出集评估结果

    # ── 分红除权数据 schemas ──

    DividendRecord:
      type: object
      description: 单条分红除权记录
      properties:
        symbol:
          type: string
          description: 标的代码
          example: 600519.SH
        announce_date:
          type: string
          format: date
          description: 公告日
        report_year:
          type: string
          description: 年报年份
          example: "2025"
        ex_dividend_date:
          type: string
          format: date
          description: 除权除息日
        record_date:
          type: string
          format: date
          description: 股权登记日
        implement_date:
          type: string
          format: date
          description: 实施日（红股/现金到账日）
        bonus_per_10:
          type: number
          format: double
          description: 每10股送股数
          example: 0
        transfer_per_10:
          type: number
          format: double
          description: 每10股转增数
          example: 0
        cash_per_10:
          type: number
          format: double
          description: 每10股派息金额（元）
          example: 27.53
        allot_per_10:
          type: number
          format: double
          description: 每10股配股数
        allot_price:
          type: number
          format: double
          description: 配股价
        ex_div_price:
          type: number
          format: double
          description: 除权参考价
          nullable: true
        action_type:
          type: integer
          description: |
            公司行为类型编码：
            - 0=未知, 1=分红, 2=送股, 3=转增
            - 4=送转, 5=分红送转, 6=配股, 7=混合
          enum: [0, 1, 2, 3, 4, 5, 6, 7]

    DividendByDateResponse:
      type: object
      description: 按日期查询的响应
      properties:
        date:
          type: string
          format: date
          description: 查询日期
        has_corporate_action:
          type: boolean
          description: 该日是否有除权除息事件
        count:
          type: integer
          description: 事件条数
        data:
          type: array
          items:
            $ref: "#/components/schemas/DividendRecord"
          description: 分红记录列表

    DividendBySymbolResponse:
      type: object
      description: 按标的查询的响应
      properties:
        code:
          type: string
          description: 标的代码
        count:
          type: integer
          description: 历史分红条数
        data:
          type: array
          items:
            $ref: "#/components/schemas/DividendRecord"
          description: 分红记录列表

    DividendSymbolListResponse:
      type: object
      description: 无参数查询返回已导入的标的列表
      properties:
        count:
          type: integer
          description: 标的数量
        symbols:
          type: array
          items:
            type: string
          description: 标的代码列表

    DividendDownloadRequest:
      type: object
      description: 手动触发分红下载请求体（所有字段可选）
      properties:
        symbols:
          type: string
          description: |
            显式传入的标的列表，逗号分隔（如 000001.SZ,600519.SH）。
            优先级最高，传入则覆盖 from_strategies。
        from_strategies:
          type: boolean
          default: true
          description: 是否从活跃策略自动收集标的（默认 true）
        years:
          type: string
          description: 下载年份范围，如 2020-2026
        env:
          type: string
          description: Python 环境名称

    DividendDownloadResponse:
      type: object
      properties:
        status:
          type: string
          example: started
        symbol_count:
          type: integer
          description: 本次下载的标的数量

    DividendDeleteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [deleted, dropped]
        code:
          type: string
          description: 被删除的标的代码（删除标的时返回）
        ex_date:
          type: string
          description: 被删除的除权除息日（删除单次分红事件时返回）

    # ═══ 日终模拟（simulate/bar） ═══
    SimulateBarRequest:
      type: object
      description: |
        一根模拟 bar。写入 `stock_1d` 后按 bar 的日期触发日终回放。
        `open/high/low` 缺省取 `close`，`volume/turnover` 缺省为 0。
      properties:
        symbol:
          type: string
          description: 标的代码（内部格式）
          example: 'sz.900001'
        datetime:
          type: string
          description: bar 时间。日期部分即决策归属日；缺省为服务器当天
          example: '2025-01-15 00:00:00'
        open:
          type: number
          example: 45.0
        high:
          type: number
          example: 46.0
        low:
          type: number
          example: 44.0
        close:
          type: number
          description: 收盘价（必填）
          example: 45.0
        volume:
          type: integer
          format: int64
          example: 1000000
        turnover:
          type: number
          example: 45000000.0
      required:
        - symbol
        - close

    SimulateBarResponse:
      type: object
      description: bar 写入结果。策略在后台异步执行，此响应不代表决策已生成。
      properties:
        status:
          type: string
          example: ok
        symbol:
          type: string
          example: 'sz.900001'
        datetime:
          type: string
          example: '2025-01-15 00:00:00'
        close:
          type: number
          example: 45.0
        message:
          type: string
          example: 'Bar written and symbol marked ready. Strategy will execute when all dependencies are met.'

    # ═══ 决策 ═══
    TradeDecision:
      type: object
      description: |
        一条待执行决策。HOLD 不入库，因此 `action` 只会出现四种开平仓动作。
      properties:
        id:
          type: integer
          example: 16
        strategy:
          type: string
          example: 'margin_test_strategy'
        symbol:
          type: string
          example: 'sz.900001'
        action:
          type: string
          enum: [open_long, close_long, open_short, close_short]
          description: |
            开多 / 平多 / 开空 / 平空。由 TradeAction + flag 派生：
            SELL+开仓=open_short（融券卖出），BUY+平仓=close_short。
        label:
          type: string
          enum: [买入开多, 卖出平多, 卖出开空, 买入平空]
          description: 中文动作描述，与 `action` 一一对应
        quantity:
          type: integer
          format: int64
          example: 4400
        price:
          type: number
          example: 45.0
        epoch:
          type: integer
          description: 产生该决策的回放 epoch
          example: 61
        timestamp:
          type: integer
          format: int64
          description: |
            决策归属日当地 00:00:00 的 epoch 秒（日终回放取模拟交易日，
            非回放路径取创建时刻）。查询接口按该时间戳的日期部分过滤。
        executed:
          type: boolean
        executedQuantity:
          type: integer
          format: int64
        executedPrice:
          type: number
        closed:
          type: boolean
          description: 是否已被人工确认关闭（PUT /trade/decisions）

    # ═══ 策略稳定性扫描 ═══
    StabilityScanRequest:
      type: object
      description: 策略稳定性扫描请求
      required:
        - action
        - csv_path
      properties:
        action:
          type: string
          enum: [scan, cancel, delete]
          description: 操作类型
        csv_path:
          type: string
          description: 宽表特征缓存 CSV 路径（DebugNode 导出或 /v0/ml action=collect 产出）
        strategy_id:
          type: string
          description: 策略标识（用于历史对比分组）
        ohlcv_cache:
          type: string
          description: OHLCV 数据路径（可选，用于计算可交易性掩码）
        entry:
          type: string
          enum: [close, next_open]
          default: close
          description: 入场价格类型
        return_horizon:
          type: integer
          default: 5
          minimum: 1
          maximum: 250
          description: 分块稳定性的主前瞻期
        horizons:
          type: array
          items:
            type: integer
          default: [1, 5, 10, 20]
          description: 信号条件曲线的横轴（主前瞻期会自动并入）
        checks:
          type: array
          items:
            type: string
            enum: [drift, block, signal]
          default: [drift, block, signal]
          description: 要执行的检查项
        features:
          type: string
          description: drift 范围（逗号分隔特征名）；空=全部
        signals:
          type: string
          description: block/curve 对象（逗号分隔信号名）；空=自动探测
        ref_mode:
          type: string
          enum: [first_frac, window, dev]
          default: first_frac
          description: 漂移分析的参考窗模式
        ref_frac:
          type: number
          default: 0.5
          minimum: 0.01
          maximum: 0.99
          description: first_frac 模式的参考窗比例
        bins:
          type: integer
          default: 10
          minimum: 2
          maximum: 50
          description: PSI 分箱数
        binning:
          type: string
          enum: [auto, quantile, width]
          default: auto
          description: PSI 分箱方式
        psi_warn:
          type: number
          default: 0.10
          minimum: 0.01
          description: PSI 告警阈值
        psi_alert:
          type: number
          default: 0.25
          minimum: 0.01
          description: PSI 报警阈值
        n_blocks:
          type: integer
          default: 5
          minimum: 2
          maximum: 50
          description: 分块稳定性折数
        quantiles:
          type: integer
          default: 5
          minimum: 2
          maximum: 20
          description: 信号曲线分桶数
        min_names:
          type: integer
          default: 15
          minimum: 2
          description: 每日最少有效标的数
        min_bucket_names:
          type: integer
          default: 5
          minimum: 1
          description: 每桶最少样本数
        py_env:
          type: string
          description: Python 环境名称

    StabilityScanSubmitResponse:
      type: object
      description: 扫描任务提交响应
      properties:
        session_id:
          type: string
          description: 会话 ID（用于查询状态和 SSE）
        run_id:
          type: string
          description: 运行 ID（用于获取结果）
        status:
          type: string
          enum: [started]

    StabilityStatusResponse:
      type: object
      description: 扫描状态响应
      properties:
        status:
          type: string
          enum: [running, done, error]
        session_id:
          type: string
        run_id:
          type: string
        progress:
          type: object
          description: 当前进度（仅 running 时）
        summary:
          type: object
          description: 扫描摘要（仅 done 时）
        error:
          type: string
          description: 错误信息（仅 error 时）

    StabilityResultResponse:
      type: object
      description: 完整扫描结果（stability.json 内容）
      properties:
        schema:
          type: string
          example: stability/v1
        meta:
          type: object
          description: 元数据（run_id, created_at, inputs, params）
        summary:
          type: object
          description: 判决摘要
        drift:
          type: object
          description: 分布漂移检查结果
        block:
          type: object
          description: 分块稳定性检查结果
        signal:
          type: object
          description: 信号条件收益曲线结果
        warnings:
          type: array
          items:
            type: object
          description: 结构化告警

    StabilityListResponse:
      type: array
      description: 历史扫描结果列表
      items:
        type: object
        properties:
          run_id:
            type: string
          created_at:
            type: string
          strategy_id:
            type: string
          csv_path:
            type: string
          checks:
            type: array
            items:
              type: string
          summary:
            type: object
