          type: array
          items:
            type: number
          description: 价格序列
        returns:
          type: array
          items:
            type: number
          description: 收益率序列
        volumes:
          type: array
          items:
            type: number
          description: 成交量序列
        abs_returns:
          type: array
          items:
            type: number
          description: 绝对收益率序列
        rolling_vol:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
          description: 滚动波动率，key 为窗口大小
        upper_2sigma:
          type: array
          items:
            type: number
          description: 波动率包络 ±2σ 上界
        mean_price:
          type: array
          items:
            type: number
          description: 滚动均值价格
        lower_2sigma:
          type: array
          items:
            type: number
          description: 波动率包络 ±2σ 下界
        annual_volatility:
          type: number
          description: 年化波动率
        max_drawdown:
          type: number
          description: 最大回撤率
        skewness:
          type: number
          description: 收益率偏度
        kurtosis:
          type: number
          description: 收益率超额峰度
        var_95:
          type: number
