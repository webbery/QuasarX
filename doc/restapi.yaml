    XGBoostOptimizeRequest:
      type: object
      required: [action, feature_cache, fast_backtest_strategy]
      description: |
        Optuna 超参数自动优化 + 快速回测评估。

        工作流：
          1. 前端先调 POST /v0/ml?action=collect 拿到 csv_path
          2. POST /v0/ml?action=optimize 把 csv_path 作为 feature_cache 传入
          3. 后端启动后台线程跑 xgboost_optimize.py，每个 trial：
             a. Python xgboost 训练 → 保存到 experiments/optimize_fast_{ts}/
             b. POST http://localhost:19107/v0/backtest (feature_cache + model_path)
             c. 解析 summary[optimize_metric] 作为 Optuna objective
          4. SSE 流式推送 trial/value/result 事件
          5. GET /v0/ml?action=train_status&session_id=... 读最终结果

        optimize_metric 字段映射（Python 侧）：
          sharpe        → summary["sharp"]
          total_return  → summary["total_return"]
          annual_return → summary["annual_return"]
          max_drawdown  → summary["max_drawdown"]（负数，越大越好）
          win_rate      → summary["win_rate"]
          calmar_ratio  → summary["calmar_ratio"]
      properties:
        action:
          type: string
          enum: [optimize]
        feature_cache:
          type: string
          description: 特征缓存 CSV 路径（POST /v0/ml?action=collect 产出）
          example: /tmp/xgb_data_xxx.csv
        fast_backtest_strategy:
          type: string
          description: 回测策略 JSON（含 XGBoost 节点，modelFile 会被脚本动态改写）
        label:
          type: object
          description: 标签配置
          properties:
            source: { type: string, example: "sz.800001.close" }
            period: { type: integer, default: 5 }
            type: { type: string, enum: [classification, regression], default: classification }
            shape: { type: string, enum: [vector, matrix], default: matrix }
            vol_k: { type: number, default: 0.5 }
        n_trials:
          type: integer
          default: 20
          description: Optuna 试验次数
        optimize_metric:
          type: string
          enum: [sharpe, total_return, annual_return, max_drawdown, win_rate, calmar_ratio]
          default: sharpe
        param_domains:
          type: string
          description: 参数搜索域 JSON 字符串
          example: '{"learning_rate":{"min":0.005,"max":0.3,"log":true}}'
        objective:
          type: string
          default: multi:softprob
        num_class:
          type: integer
          default: 3
        test_ratio:
          type: number
          default: 0.2
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        frequency:
          type: string
          default: 1d
        auth_token:
          type: string
          description: 透传给 Python 脚本（访问 /v0/backtest 时用）
        py_env:
          type: string
          description: Python 解释器环境名（可选）

    XGBoostTrainResponse:
      type: object
      properties:
        model_id: { type: integer }
        model_path: { type: string }
        best_iteration: { type: integer }
        n_train: { type: integer }
        n_test: { type: integer }
        n_features: { type: integer }
        features:
          type: array
          items: { type: string }
        learning_curve:
          type: array
          items:
            type: object
            properties:
              iteration: { type: integer }
              train_loss: { type: number }
              eval_loss: { type: number }
        feature_importance:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              gain: { type: number }
              weight: { type: number }
              cover: { type: number }
        eval_metrics:
          type: object
          additionalProperties: { type: number }
        predictions:
          type: array
          items:
            type: object
            properties:
              actual: { type: number }
              predicted: { type: number }
              pred_class: { type: integer }

    XGBoostShapResponse:
      type: object
      properties:
        model_id: { type: integer }
        features:
          type: array
          items: { type: string }
        shap:
          type: array
          items:
            type: array
            items: { type: number }
        base_value:
          type: array
          items: { type: number }
        n_samples: { type: integer }

    XGBoostDeleteResponse:
      type: object
      properties:
        message: { type: string, example: "deleted" }

    XGBoostOptimizeSubmitResponse:
      type: object
      description: action=optimize 提交后立即返回的响应（session_id 用于后续 SSE/poll）
      properties:
        session_id:
          type: string
          example: xgb_opt_1234567890
        status:
          type: string
          enum: [running]
        n_trials:
          type: integer
        optimize_metric:
          type: string

    XGBoostOptimizeResult:
      type: object
      description: |
        action=optimize 完成后的最终结果（通过 GET /v0/ml?action=train_status 获取）。
        与 xgboost_optimize.py 的 {"type":"result"} 输出对齐。
      properties:
        best_params:
          type: object
          additionalProperties: true
          description: 最优超参
        best_value:
          type: number
          description: 最优 optimize_metric 值
        best_trial_number:
          type: integer
        best_model:
          type: string
          description: 最优模型路径（experiments/optimize_fast_{ts}/best.json）
        n_trials:
          type: integer
        n_completed:
          type: integer
        trials:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              value: { type: number }
              best: { type: number }
              params:
                type: object
                additionalProperties: true
              duration_ms: { type: integer }
              status: { type: string, enum: [ok, failed] }
              summary:
                type: object
                additionalProperties: true
        importance:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              importance: { type: number }
        optimization_duration_ms:
          type: integer
        metric:
          type: string
        output_dir:
          type: string

    # ── 分红除权数据 schemas ──

    DividendRecord:
      type: object
      description: 单条分红除权记录
      properties:
        symbol:
          type: string
          description: 标的代码
          example: 600519.SH
        announce_date:
          type: string
          format: date
          description: 公告日
        report_year:
          type: string
          description: 年报年份
          example: "2025"
        ex_dividend_date:
          type: string
          format: date
          description: 除权除息日
        record_date:
          type: string
          format: date
          description: 股权登记日
        implement_date:
          type: string
          format: date
          description: 实施日（红股/现金到账日）
        bonus_per_10:
          type: number
          format: double
          description: 每10股送股数
          example: 0
        transfer_per_10:
          type: number
          format: double
          description: 每10股转增数
          example: 0
        cash_per_10:
          type: number
          format: double
          description: 每10股派息金额（元）
          example: 27.53
        allot_per_10:
          type: number
          format: double
          description: 每10股配股数
        allot_price:
          type: number
          format: double
          description: 配股价
        ex_div_price:
          type: number
          format: double
          description: 除权参考价
          nullable: true
        action_type:
          type: integer
          description: |
            公司行为类型编码：
            - 0=未知, 1=分红, 2=送股, 3=转增
            - 4=送转, 5=分红送转, 6=配股, 7=混合
          enum: [0, 1, 2, 3, 4, 5, 6, 7]

    DividendByDateResponse:
      type: object
      description: 按日期查询的响应
      properties:
        date:
          type: string
          format: date
          description: 查询日期
        has_corporate_action:
          type: boolean
          description: 该日是否有除权除息事件
        count:
          type: integer
          description: 事件条数
        data:
          type: array
          items:
            $ref: "#/components/schemas/DividendRecord"
          description: 分红记录列表

    DividendBySymbolResponse:
      type: object
      description: 按标的查询的响应
      properties:
        code:
          type: string
          description: 标的代码
        count:
          type: integer
          description: 历史分红条数
        data:
          type: array
          items:
            $ref: "#/components/schemas/DividendRecord"
          description: 分红记录列表

    DividendSymbolListResponse:
      type: object
      description: 无参数查询返回已导入的标的列表
      properties:
        count:
          type: integer
          description: 标的数量
        symbols:
          type: array
          items:
            type: string
          description: 标的代码列表

    DividendDownloadRequest:
      type: object
      description: 手动触发分红下载请求体（所有字段可选）
      properties:
        symbols:
          type: string
          description: |
            显式传入的标的列表，逗号分隔（如 000001.SZ,600519.SH）。
            优先级最高，传入则覆盖 from_strategies。
        from_strategies:
          type: boolean
          default: true
          description: 是否从活跃策略自动收集标的（默认 true）
        years:
          type: string
          description: 下载年份范围，如 2020-2026
        env:
          type: string
          description: Python 环境名称

    DividendDownloadResponse:
      type: object
      properties:
        status:
          type: string
          example: started
        symbol_count:
          type: integer
          description: 本次下载的标的数量

    DividendDeleteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [deleted, dropped]
        code:
          type: string
          description: 被删除的标的代码（删除标的时返回）
        ex_date:
          type: string
          description: 被删除的除权除息日（删除单次分红事件时返回）
