          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: 触发行情数据下载与导入
      description: |
        后台异步下载行情数据并导入 DuckDB，通过 SSE 推送进度事件。
        自动按标的类型（ETF/Stock）分组下载，同时下载后复权和不复权数据。
      tags:
        - Quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteDownloadRequest"
      responses:
        '200':
          description: 下载任务已启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDownloadResponse"
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: 删除行情数据
      description: |
        按条件删除行情数据：
        - table + symbol：删除指定表中指定标的数据
        - 仅 table：删除整张表
        - 无参数：删除所有行情表
      tags:
        - Quote
      parameters:
        - in: query
          name: table
          schema:
            type: string
          description: 表名（留空删除所有表）
        - in: query
          name: symbol
          schema:
            type: string
          description: 标的代码（留空删除整表）
        - in: query
          name: date
          schema:
            type: string
          description: |
            单根 K 线日期/时刻（YYYY-MM-DD 或 YYYY-MM-DD HH:MM:SS）。
            与 table+symbol 同时提供时，精确删除该根 K 线。
            与 table+symbol 中任一缺失时按原逻辑处理（删除整表/全部表）。
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDeleteResponse"
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

