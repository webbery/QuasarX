  /analysis/stability:
    post:
      summary: 策略稳定性扫描
      description: |
        对策略的特征分布、信号稳定性、信号条件收益曲线进行系统性检查。
        支持三项分析：
        - **drift**：特征分布漂移检查（PSI/KS 检验，缺失率跳变，滚动 PSI）
        - **block**：分块稳定性检查（连续折 IC、top-k 超额、单调性趋势）
        - **signal**：信号条件前瞻收益曲线（分桶收益、spread、单调性）

        输入为宽表特征缓存 CSV（DebugNode 导出或 /v0/ml action=collect 产出），
        输出为一份 JSON 报告（`stability.json`），包含三项分析的完整结果。

        **异步执行**：提交后立即返回 `session_id` 和 `run_id`，通过 SSE 推送进度，
        通过 `GET ?action=status` 查询状态，通过 `GET ?action=result` 获取完整结果。

        **与 ML 的关系**：本端点独立于 `/v0/ml`，不依赖训练流程。可用于：
        - ML 策略：检查特征分布漂移、信号稳定性
        - 非 ML 策略：检查信号稳定性、信号条件收益曲线
        - 任何策略：检查特征分布漂移

        **产物**：只输出一份 JSON（`stability.json`），不生成 md/csv/图。
        历史对比靠 `run_id` + 文件自身，`meta.inputs.csv_sha256` 保证可复现。
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StabilityScanRequest"
            examples:
              basic:
                summary: 基础扫描（drift + block + signal）
                value:
                  action: scan
                  csv_path: "/data/debug/CTA_v16/xgb_debug.csv"
                  strategy_id: "CTA_v16"
                  checks: ["drift", "block", "signal"]
              drift_only:
                summary: 只检查分布漂移
                value:
                  action: scan
                  csv_path: "/data/debug/CTA_v16/xgb_debug.csv"
                  checks: ["drift"]
                  psi_warn: 0.10
                  psi_alert: 0.25
      responses:
        '200':
          description: 扫描任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StabilityScanSubmitResponse"
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '409':
          description: 已有扫描任务在运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conflict"
    get:
      summary: 查询稳定性扫描状态/结果
      description: |
        通过 `action` 参数区分四种操作：
        - `events`：SSE 流，实时推送扫描进度（step/progress/result/warning）
        - `status`：查询当前扫描状态（running/done/error）
        - `result`：获取完整结果 JSON（通过 `run_id`）
        - `list`：列出所有历史扫描结果
      tags:
        - Analysis
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [events, status, result, list]
          description: 操作类型
        - in: query
          name: session_id
          schema:
            type: string
          description: 会话 ID（events/status 必填）
        - in: query
          name: run_id
          schema:
            type: string
          description: 运行 ID（result 必填）
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StabilityStatusResponse"
                  - $ref: "#/components/schemas/StabilityResultResponse"
                  - $ref: "#/components/schemas/StabilityListResponse"
        '404':
          description: 会话或结果不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

