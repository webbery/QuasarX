    StrategyBatchModelsResponse:
      type: object
      description: |
        `POST /v0/strategy {action:"batch_models", names:[...]}` 响应。
        每个策略名作为 key，value 描述该策略所有 XGBoostNode 绑定的模型清单。
      additionalProperties:
        type: object
        properties:
          strategy:
            type: string
            description: 策略名
          error:
            type: string
            description: 当策略文件缺失或解析失败时填充，正常情况下不存在
          models:
            type: array
            description: 该策略关联的所有 XGBoost 模型（每个 xgboost 节点一个）
            items:
              type: object
              properties:
                node_id:
                  type: string
                  description: XGBoost 节点 id
                label:
                  type: string
                  description: XGBoost 节点 label（用于文件名后缀）
                model_file:
                  type: string
                  description: 策略 JSON 中 modelFile 字段值（如 production/CTA_v16-CTA_v16.json）
                production:
                  type: object
                  nullable: true
                  description: 当前生产模型信息（路径 + 完整 meta.json）
                  properties:
                    path:
                      type: string
                    meta:
                      type: object
                      description: .meta.json 全部内容（含 version/display_name/created_at/features/n_train/n_test 等）
                latest_experiment:
                  type: object
                  nullable: true
                  description: 该 strategy_id 关联的最新一次训练产物（路径 + 完整 meta.json）
                  properties:
                    path:
                      type: string
                    meta:
                      type: object
                is_latest:
                  type: boolean
                  description: |
                    true 表示当前 production 模型不落后于最新实验（已发布或没有更新实验）；
                    false 表示最新实验比 production 新，提示需要重新发布

    StrategyRequest:
      type: object
      properties:
        name:
          type: string
          description: 策略名称（action=reclaim / batch_models 时也用于指定目标）
          example: 'xgboost'
        mode:
          type: integer
          description: 模式, 0-部署并运行, 1-运行已部署的策略, 2-停止运行中的策略
          example: 0
        action:
          type: string
          description: |
            内置动作，与 mode 二选一：
            validate=只校验策略图；load=只初始化不落盘不运行；
            reclaim=归还指定策略的资金（需 name）；reclaim_all=归还全部策略资金；
            batch_models=批量查询模型绑定（需 names）。
          example: 'reclaim'
        force:
          type: boolean
          description: 部署时同名策略仍在运行则强制覆盖（默认 false，冲突返回 409）
          default: false
        names:
          type: array
          items:
            type: string
          description: action=batch_models 时的策略名列表
          example: ['xgboost', 'momentum']
        script:
          type: object
          description: 策略图 JSON (仅在 mode=0 部署时需要)
          example: {}
        params:
          type: object
          description: 训练模式下的参数
          example: {}
