          description: 资产标的列表
        forecast_cov:
          type: array
          items:
            type: array
            items:
              type: number
          description: 外推协方差矩阵（N×N）
        forecast_corr:
          type: array
          items:
            type: array
            items:
              type: number
          description: 外推相关系数矩阵（N×N）
        forecast_volatilities:
          type: array
          items:
            type: number
