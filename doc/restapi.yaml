  /strategy:
    get:
      summary: 获取所有策略列表
      description: |
        获取所有策略的运行状态。返回结构包含两个数组：
        - `strategies`：已成功初始化并处于运行/停止状态的策略
        - `failed`：初始化失败的策略（含具体失败节点信息），供前端展示
        可选 query `include=pools` 在每条 `strategies[]` 项中额外返回 `symbols` 字段，
        即该策略所有 QuoteInputNode 配置的标的代码集合（如 `['sz.000001', 'sh.600000']`），
        仅在调用方需要按策略批量下载行情数据时使用。
      tags:
        - Strategy
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: string
            enum: [pools]
          description: 附加字段开关。`pools` 时为每个策略附加 `symbols` 标的池数组。
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyListResponse"
    post:
      summary: 部署/运行/停止指定的某个策略 / 批量查询模型绑定
      security:
        - BearerAuth: []
      description: |
        根据 mode 参数执行不同操作：0-部署并运行策略，1-运行已部署的策略，2-停止运行中的策略。
        也支持通过 `action` 字段触发内置动作：
        - `validate`：只校验策略图，不部署；
        - `load`：只初始化策略（InitStrategy），不写文件、不运行；
        - `reclaim`：归还指定策略在 CapitalPool 里占用的资金，需同时传 `name`
          （部署时会向资金池借一笔额度，Stop/删除都不会自动归还）；
        - `reclaim_all`：归还全部策略的资金；
        - `batch_models`：批量返回每个策略关联的所有 XGBoost 模型信息（production + 最新 experiment + is_latest）。
          请求体为 `{names: ["strat1","strat2"]}`，10s 服务端缓存，避免每次策略列表刷新都重扫磁盘。
          前端 StrategyTracker 展开策略行时调用，对应 `StrategyBatchModelsResponse`。
        部署（mode=0）时同名策略仍在运行会返回 409，可用 `force: true` 强制覆盖。
      tags:
        - Strategy
      requestBody:
        description: 参数
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyRequest"
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyResponse"
    delete:
      summary: 删除指定的某个策略
      security:
        - BearerAuth: []
      description: 停止并删除指定的策略及其脚本文件
      tags:
        - Strategy
      requestBody:
        description: 参数
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 策略名称
              required:
                - name
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
