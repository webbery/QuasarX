            items:
              type: number
          description: IMF 分量数组，每个元素是一个时间序列
        residual:
          type: array
          items:
            type: number
          description: 残差序列（原始信号减去所有 IMF）
        imf_info:
          type: array
          items:
            $ref: "#/components/schemas/IMFInfo"
          description: 各 IMF 分量的频率特征和能量分布
        reconstruction_error:
          type: number
          description: 重建误差（RMS 值，衡量 IMF+残差 还原原始信号的精度）

    CapacityRequest:
      type: object
      description: 容量扫描请求（POST /v0/capacity）
      required:
        - strategy
      properties:
        strategy:
          type: string
          description: 策略名（scripts/ 目录下的 JSON 文件名）
          example: cta_v13
        method:
          type: string
          description: |
            市占率计算方法（2026-09 新增）
              - turnover_market_share (默认): participation = 订单成交额 / ADTV
              - volume_market_share: participation = 订单股数 / ADV (旧实现行为)
          enum:
            - turnover_market_share
            - volume_market_share
          default: turnover_market_share
        capital_range:
          type: object
          description: 资金量扫描范围（对数均匀生成 steps 个点）
          properties:
            min:
              type: number
              description: 扫描最小资金量（元）
              default: 100000
            max:
              type: number
              description: 扫描最大资金量（元）
              default: 10000000
            steps:
              type: integer
              description: 扫描点数（对数均匀）
              default: 20
        impact_model:
          type: object
          description: 平方根冲击模型参数
          properties:
            eta:
              type: number
              description: 冲击系数（A 股经验值 0.5-1.5，默认 1.0）
              default: 1.0
            adv_window:
              type: integer
              description: ADV 滚动窗口（交易日数）
              default: 20
        constraints:
          type: object
          description: 容量约束（参考线，不做硬截断）
          properties:
            max_participation_rate:
              type: number
              description: 单笔订单参考参与率上限（默认 5%）
              default: 0.05
        closing_liquidity_ratio:
          type: number
          description: |
            收盘流动性比例（盘后固定价格交易窗口占全天 ADV 的比例）。
            日终策略推荐 0.05；<=0 表示用全天 ADV（日内模式）。
          default: 0.0

    CapacityResponse:
      type: object
      description: 容量扫描响应
      properties:
        strategy:
          type: string
        method:
          type: string
          description: 实际使用的 method（默认 turnover_market_share）
        method_description:
          type: string
          description: method 的人类可读说明
        closing_liquidity_ratio:
          type: number
        baseline:
          type: object
          description: 基准（零冲击）的指标
          properties:
            sharpe:
              type: number
            total_return:
              type: number
            max_drawdown:
              type: number
            win_rate:
              type: number
            n_trades:
              type: integer
        capacity_curve:
          type: array
          description: 每个资金量点的指标（对数均匀）
          items:
            type: object
            properties:
              capital:
                type: number
              sharpe:
                type: number
              total_return:
                type: number
              max_drawdown:
                type: number
              win_rate:
                type: number
              avg_participation:
                type: number
              max_participation:
                type: number
              avg_slippage_bps:
                type: number
              orders_above_limit:
                type: integer
              sharpe_decay:
                type: number
                description: 相对基准 Sharpe 的衰减率（0-1）
        summary:
          type: object
          description: 容量摘要
          properties:
            capacity_20pct:
              type: number
              description: Sharpe 衰减 20% 对应的资金量（保守容量）
            capacity_50pct:
              type: number
              description: Sharpe 衰减 50% 对应的资金量（激进容量）
            bottleneck_symbol:
              type: string
              description: 瓶颈标的（按 method 对应 ADV 池，最小均值者）
            bottleneck_adv:
              type: number
              description: 瓶颈标的的均值 ADV（按 method 对应，单位股数或元）

    Error:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100000
        msg:
          type: string
          example: error

    # 波动率分析相关类型
    ACFDecayAnalysis:
      type: object
      description: ACF 衰减模式分析结果
      properties:
        lb_statistic:
          type: number
          description: Ljung-Box Q 统计量
        lb_pvalue:
          type: number
          description: Ljung-Box p 值（p < 0.05 表示存在显著自相关）
        has_autocorrelation:
          type: boolean
          description: 是否存在显著自相关
        exponential_r2:
          type: number
          description: 指数衰减拟合 R²（GARCH/EGARCH）
        hyperbolic_r2:
          type: number
          description: 双曲衰减拟合 R²（FIGARCH/长记忆）
        decay_mode:
          type: string
          enum: [exponential, hyperbolic, inconclusive]
          description: 衰减模式
        decay_half_life:
          type: number
          description: 指数衰减半衰期
        hurst_estimate:
          type: number
          description: Hurst 指数估计

    ForecastResult:
      type: object
      description: AR(p) 自回归预测结果
      properties:
        source_series:
          type: string
          enum: [returns, rolling_vol]
          description: 预测来源序列
        order_p:
          type: integer
          description: AR 模型阶数
        ar_coeffs:
          type: array
          items:
            type: number
          description: AR 系数 φ₁, φ₂, ..., φₚ
        residual_var:
          type: number
          description: 残差方差 σ²
        forecast_values:
          type: array
          items:
            type: number
          description: 预测值序列（1..p 步）
        forecast_upper_1sigma:
          type: array
          items:
            type: number
          description: ±1σ 置信上界
        forecast_lower_1sigma:
          type: array
          items:
            type: number
          description: ±1σ 置信下界
        forecast_upper_2sigma:
          type: array
          items:
            type: number
          description: ±2σ 置信上界
        forecast_lower_2sigma:
          type: array
          items:
            type: number
          description: ±2σ 置信下界
        forecast_std:
          type: array
          items:
            type: number
          description: 每步预测标准差（用于前端渐变透明度）
        has_autocorrelation:
          type: boolean
          description: 是否存在显著自相关（false 时预测结果无效）
        note:
          type: string
          description: 诊断信息（如 "AR(5) from returns, R²≈0.23"）

    VolatilitySingleResult:
      type: object
      description: 单标的波动率分析结果
      properties:
