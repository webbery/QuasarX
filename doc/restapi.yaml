        cvar_95:
          type: number
          description: 95% CVaR
        returns_acf:
          type: array
          items:
            type: number
          description: 收益率 ACF
        returns_pacf:
          type: array
          items:
            type: number
          description: 收益率 PACF
        abs_returns_acf:
          type: array
          items:
            type: number
          description: 绝对收益率 ACF
        acf_decay:
