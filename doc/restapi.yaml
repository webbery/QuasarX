  /backtest:
    post:
      summary: 对某个策略做回测
      description: |
        对某个策略做回测。支持两种模式：
        - **正常模式**：完整执行策略图（特征计算 → 模型推理 → 信号 → 执行）
        - **快速模式**：跳过特征计算节点，从缓存加载特征（用于 Optuna 超参优化加速）
      tags:
        - Backtest
      requestBody:
        description: 参数
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                script:
                  type: string
                  description: 策略图的json
                  example: ""
                validate:
                  type: boolean
                  description: 是否验证策略图完整性（快速回测时可设为 false）
                  default: true
                feature_cache:
                  type: string
                  description: |
                    快速回测模式：预计算的特征缓存 CSV 文件路径。
                    提供后，策略图中 XGBoost 上游的特征节点（EMD/CUSUM/Function/Formula/Breakout/HMM）
                    会被自动替换为 CacheFeatureNode，从该 CSV 加载特征数据。
                    CSV 格式与 /v0/ml collect 产出的 CSV 一致（首列 date，后续列为完整 context key）。
                  example: "/tmp/xgb_data_12345_abcdef.csv"
                model_path:
                  type: string
                  description: |
                    快速回测模式：预训练的 XGBoost 模型逻辑路径（相对于 {dbPath}/models/）。
                    提供后会覆盖策略图中 XGBoost 节点的 modelFile 参数。
                  example: "experiments/test_xgb_train_20260827_190316.json"
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResponse"
        '404':
          description: fail
  /capacity:
    post:
      summary: 策略容量扫描（两阶段：基准回测 + 快速重放）
      description: |
        通过 SQUARE-ROOT 冲击模型对策略做不同资金量的快速重放：
        - Phase 1 跑零冲击基准回测，提取交易日志
        - Phase 2 对每个资金量按 method 算市占率 → 平方根冲击定价 → 重算指标
        容量定义为 Sharpe 相对基准衰减 20% / 50% 对应的资金量。

        **method 字段决定市占率分母**（2026-09 新增）：
        - `turnover_market_share`（默认）：participation = 订单成交额 / ADTV。跨价格带策略更稳定。
        - `volume_market_share`：participation = 订单股数 / ADV。保持旧实现行为。
      tags:
        - Backtest
      requestBody:
        description: 容量扫描参数
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapacityRequest"
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        '400':
          description: 参数错误（缺 strategy / JSON 解析失败）
        '404':
          description: 策略文件不存在
        '500':
          description: 回测失败或市场数据加载失败
