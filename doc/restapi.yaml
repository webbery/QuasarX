  # ═══════════════════════════════════════════════════════════
  #  机器学习训练与分析
  # ═══════════════════════════════════════════════════════════
  /ml:
    post:
      summary: ML 训练 / SHAP 计算 / 模型管理
      description: |
        单端点设计，通过 body 中的 "action" 字段路由不同操作：

        - action=train：训练模型
          1. 解析策略图，提取 XGBoost 上游子图
          2. 部分执行回测，收集节点输出作为特征
          3. 调用 xgboost_train.py 训练模型
          4. 返回学习曲线、特征重要性、评估指标、预测结果等 JSON
          5. 模型句柄保留在内存供 SHAP 计算

          **Walk-forward 交叉验证**：传入 `cv.enabled=true` 时，训练流程切换为
          walk-forward OOF 评估 + 全量 refit：
          - 按 `cv.walk_forward.train_len/oos_len/gap` 生成折计划（单位：唯一交易日期数）
          - 每折训练 + 预测 OOS，收集 OOF 预测，计算 OOF 指标和截面/时序 IC（含 Newey-West t）
          - 最终模型在全量数据上重训，轮数取各折 best_rounds 的中位数
          - 折内 early stopping 用训练段末尾的 `inner_val_ratio`，并在 inner train/inner val 之间留 gap
          - `cv.scheme` 当前仅支持 `walk_forward`，`cv.final_model` 仅支持 `refit_full`
          - `cv.gap.bars` 不传时默认等于 `label.period`；小于 `label.period` 会自动抬升并告警
          - `cv.nw.lag=0` 自动取 `max(10, 2 * label.period)`

          **数据切分**：matrix/vector 两条路径都按"唯一日期"切分，保证同一天的所有标的
          落在同一段；不再按行号切分（旧实现会把最后几个标的当成测试集）。

          **折间隔离（purge）**：单次切分时，训练侧那一段的尾部会挖掉 `gap_bars`
          个交易日（不传时取 `label.period`），避免训练样本的前瞻标签窗口伸进
          验证/测试段。留出段保持完整的名义跨度 —— 它是唯一无偏的读数。
          响应里的 `leakage_checks.overlap_rows` 是**实际算出来**的污染行数
          （此前是硬编码的字面量 0），`gap_applied=false` 表示缺日期列、
          无法按日期留间隔。

        - action=optimize：Optuna 自动优化 + 快速回测评估
          1. 前端先调 action=collect 拿到 csv_path 作为 feature_cache 传入
          2. 后端后台线程启动 xgboost_optimize.py
          3. 每个 Optuna trial：训练模型 → 保存到 experiments/ → 调 /v0/backtest
             （feature_cache + model_path 快速模式）
          4. **选超参只看 DEV 段**（`val_ratio` 那段）：objective 用 DEV 段的
             窗口指标，不再用整段历史回测的 summary —— 后者会让测试期参与
             超参选择。`select_window=full` 可切回旧口径（仅用于复现历史数字）
          5. 对各 trial 的 DEV 显著性做 BH-FDR 校正（`fdr_alpha`），
             `select_by=q` 时只在通过校正的 trial 里选
          6. 搜索结束后对选中的 trial 在**留出段**（`test_ratio` 那段）评一次，
             `selection.selection_bias = best_dev_value − holdout_value`
             直接给出"选超参本身乐观了多少"
          7. SSE 流式推送 trial/value/result 事件
          8. 通过 GET /v0/ml?action=train_status&session_id=... 读取最终 best_params

        - action=collect：收集特征数据
          与 train 共享上游子图执行逻辑，但只收集不训练，返回 csv_path

        - action=screen：特征筛选门禁（Step 1）
          1. 输入一份特征缓存 CSV（collect 返回的 csv_path），**不需要策略图、不需要行情源**
          2. 后台线程调用 tools/feature_screen.py，统一口径计算：
             日频横截面 rank IC、Newey-West t、折稳定性、top-k 超额、
             增量 IC（残差回归）、BH FDR / Bonferroni、IC 衰减、滞后敏感性
          3. 结果落到 `<server.db_path>/reports/feature_screen/<run_id>/`
             （feature_screen.json / .csv / .md）
          4. SSE 推送 prepare / validate / load_cache / compute_target / evaluate /
             multiple_testing / report 等 step，以及逐特征 progress
          5. `GET ?action=train_status&session_id=...` 读 summary + files；
             完整逐特征明细用 `GET ?action=screen_result&run_id=...`
          6. 服务端调用固定加 `--no-plot`：不依赖 matplotlib，绘图由前端用
             JSON 里的 `dev` / `test` / `decay` / `yearly` / `lag` 字段完成
          7. screen 与 train/optimize/collect 共用单会话槽，同一时刻只跑一个

        - action=shap：计算 SHAP 值
          使用 XGBoost C API 在 C++ 端直接计算（XGBOOST_OUTPUT_CONTRIBUTION），
          不依赖 Python shap 库，不持久化到数据库。

        - action=delete：释放内存中的模型
        - action=delete_file：按路径删除磁盘文件（仅限 experiments/ 与 production/）
        - action=update_meta：修改 .meta.json 白名单字段（version / display_name / description）。
          用于在 ML 绑定界面（useModelBinding）训练后给实验/生产模型打语义版本号和友好名称。
          不动模型文件本身，避免破坏 XGBoostNode.modelFile 路径引用。

        训练结果（学习曲线/特征重要性/评估指标/预测）不存数据库，
        训练完成后通过单次 JSON 响应返回前端，前端 useXGBoostState 缓存。
      tags:
        - XGBoost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/XGBoostTrainRequest"
                - $ref: "#/components/schemas/XGBoostShapRequest"
                - $ref: "#/components/schemas/XGBoostDeleteRequest"
                - $ref: "#/components/schemas/XGBoostUpdateMetaRequest"
                - $ref: "#/components/schemas/XGBoostOptimizeRequest"
                - $ref: "#/components/schemas/XGBoostScreenRequest"
            examples:
              train:
                summary: 训练模型（单次切分）
                value:
                  action: train
                  script: '{"id":"strategy_demo","nodes":[...], "edges":[...]}'
                  label:
                    source: sh.600000.close
                    period: 5
                    type: classification
                    threshold: 0.0
                  objective: binary:logistic
                  num_class: 2
                  test_ratio: 0.2
                  params:
                    learning_rate: 0.1
                    max_depth: 6
                    n_estimators: 200
                    early_stopping_rounds: 20
              train_cv:
                summary: 训练模型（walk-forward 交叉验证）
                value:
                  action: train
                  script: '{"id":"strategy_demo","nodes":[...], "edges":[...]}'
                  label:
                    source: sh.600000.close
                    period: 5
                    type: classification
                    shape: matrix
                    vol_k: 0.5
                    sigma_mode: expanding
                  params:
                    learning_rate: 0.1
                    max_depth: 6
                    n_estimators: 200
                    early_stopping_rounds: 20
                  cv:
                    enabled: true
                    scheme: walk_forward
                    n_folds: 5
                    walk_forward:
                      train_len: 504
                      oos_len: 63
                      step: 63
                      window_mode: rolling
                      inner_val_ratio: 0.15
                    gap:
                      mode: label
                      bars: 5
                    nw:
                      lag: 0
                    final_model: refit_full
              optimize:
                summary: Optuna 自动优化（快速回测评估）
                value:
                  action: optimize
                  feature_cache: /tmp/xgb_data_xxx.csv
                  fast_backtest_strategy: '{"id":"cta_v13","nodes":[...],"edges":[...]}'
                  label:
                    shape: matrix
                    period: 5
                    type: classification
                    vol_k: 0.5
                  n_trials: 20
                  optimize_metric: sharpe
                  param_domains: '{"learning_rate":{"min":0.005,"max":0.3,"log":true}}'
                  objective: multi:softprob
                  num_class: 3
                  test_ratio: 0.2
                  val_ratio: 0.15
                  # 选优口径：只用 DEV 段选超参，留出段只评一次
                  select_window: val
                  select_by: dev_metric
                  fdr_alpha: 0.10
              screen:
                summary: 特征筛选（门禁）
                value:
                  action: screen
                  csv_path: /tmp/xgb_data_xxx.csv
                  label:
                    period: 5
                    vol_k: 0.34
                    sigma_mode: expanding
                  horizons: [1, 5, 10, 20]
                  entry: close
                  n_folds: 5
                  rules:
                    min_ic: 0.02
                    min_t: 2.5
                    min_sign_folds: 4
                    fdr_q: 0.10
                    min_coverage: 0.50
                    gate_topk: 5
                  trial_count: 0
                  lag_shifts: [-2, -1, 0, 1, 2]
              shap:
                summary: 计算 SHAP 值
                value:
                  action: shap
                  model_id: 1
              delete:
                summary: 删除模型
                value:
                  action: delete
                  model_id: 1
      responses:
        '200':
          description: |
            操作结果。
            train 返回训练指标 + predictions + feature_importance + learning_curve + model_id
            optimize 立即返回 session_id（运行中），最终结果通过 train_status 获取
            shap 返回 shap 矩阵 + features + base_value
            delete 简单返回 message
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/XGBoostTrainResponse"
                  - $ref: "#/components/schemas/XGBoostOptimizeSubmitResponse"
                  - $ref: "#/components/schemas/XGBoostScreenSubmitResponse"
                  - $ref: "#/components/schemas/XGBoostShapResponse"
                  - $ref: "#/components/schemas/XGBoostDeleteResponse"
        '400':
          description: 参数错误（如缺 action 字段、label.source 缺失）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: 模型未找到（shap/delete 操作时）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: 查询训练/筛选会话状态与产物
      description: |
        通过 `action` 查询参数路由：

        - `action=list`：列出 experiments/ 与 production/ 下的模型文件
        - `action=train`：会话进度 **SSE 流**。重放历史事件后实时推送。
          train / optimize / collect / screen 共用这同一条通道。
          事件名：`step` / `progress` / `log` / `warning` / `error`
        - `action=train_status`：会话最终结果（`status` = running | done | error）
        - `action=screen_result`：按 `run_id` 读取一次特征筛选的完整 JSON
        - `action=download`：下载模型文件（`model_id`）
        - `action=shap`：GET 形式的 SHAP 计算（`model_id`）
      tags:
        - XGBoost
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [list, train, train_status, screen_result, download, shap]
        - name: session_id
          in: query
          schema:
            type: string
          description: action=train / train_status 时必填
        - name: run_id
          in: query
          schema:
            type: string
          description: |
            action=screen_result 时必填。形如 `screen_20261021_190500_1234`，
            由 POST action=screen 的返回/SSE 或 train_status 结果给出。
        - name: model_id
          in: query
          schema:
            type: integer
            format: int64
          description: action=download / shap 时必填
        - name: strategy_id
          in: query
          schema:
            type: string
          description: action=list 时可选，按策略过滤
      responses:
        '200':
          description: |
            list → 模型列表；train → text/event-stream；
            train_status → 会话结果；screen_result → 完整特征筛选 JSON；
            download → 模型 JSON。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/XGBoostListResponse"
                  - $ref: "#/components/schemas/XGBoostScreenResult"
                  - $ref: "#/components/schemas/XGBoostScreenDetail"
                  - $ref: "#/components/schemas/XGBoostTrainResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE 流；每条消息形如 `event:<type>\ndata:<json>\n\n`
        '400':
          description: 缺少或非法的查询参数（如 run_id 不符合白名单格式）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: 会话 / 模型 / 筛选结果不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /strategy/simulate/bar:
    post:
      summary: 注入一根模拟 bar 并触发日终策略
      security:
        - BearerAuth: []
      description: |
        仅 Debug 构建（`_DEBUG`）注册此路由。流程：写入 QuoteDB（`stock_1d`）
        → 重算后复权 → 标记该标的就绪 → 当策略依赖的全部标的就绪时，
        异步执行一次日终回放（决策归属日取 bar 的 `datetime`）。

        **重跑语义**：
        - 仿真日期变化：重置日终状态，按新日期重跑；
        - 同一仿真日、**同一标的**重复推送：视为该交易日数据被改写，重置后重跑；
        - 同一仿真日推**不同**标的（多标的逐标的灌数据）：不重置，
          等全部标的就绪后统一执行一次。

        接口 200 只表示 bar 已写入并触发，决策在后台线程生成，
        需要稍后通过 `GET /trade/decisions?date=<决策归属日>` 读取。
        只有 BUY/SELL 会入库，HOLD 不产生决策记录。
      tags:
        - Strategy
      requestBody:
        description: bar 数据
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateBarRequest"
      responses:
        '200':
          description: bar 已写入，策略异步执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateBarResponse"
        '400':
          description: 参数缺失或 JSON 解析失败（symbol、close 必填）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: QuoteDB 未初始化或写入失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trade/decisions:
    get:
      summary: 查询指定归属日的决策
      security:
        - BearerAuth: []
      description: |
        按决策归属日查询待执行决策，日期取 `decisions.timestamp` 的日期部分。
        该时间戳在日终执行时由 `DecisionSet.as_of`（模拟交易日）写入，
        不是记录创建时的墙钟时间——所以回放 `2025-01-15` 的 bar，
        记录会落在 `2025-01-15` 而不是执行当天。

        只返回 BUY/SELL 对应的四类动作（open_long / close_long / open_short /
        close_short）。HOLD 表示"无动作"，不写入决策表。
        未传 `date` 时默认服务器当天。

        注意：当前不支持按策略过滤，`strategy` 参数会被忽略，返回该日所有策略的决策。
      tags:
        - Order
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
            example: '2025-01-15'
          description: 决策归属日（YYYY-MM-DD），缺省为服务器当天
      responses:
        '200':
          description: 决策列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeDecision"
        '401':
          description: 缺少或非法的 Authorization
    put:
      summary: 标记决策已确认（关闭，不执行）
      security:
        - BearerAuth: []
      description: 将指定决策标记为 closed，之后不再作为待执行指令返回
      tags:
        - Order
      requestBody:
        description: 参数
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 决策 id
                  example: 16
              required:
                - id
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: 决策不存在
    delete:
      summary: 清除指定归属日的决策记录
      security:
        - BearerAuth: []
      description: 删除 `decisions` 表中该日期的记录，并清空内存缓存。
      tags:
        - Order
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
            example: '2025-01-15'
          description: 要清除的归属日（YYYY-MM-DD），缺省为服务器当天
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deleted:
                    type: integer
                    description: 删除的决策条数
                    example: 1

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token 认证。通过 POST /v0/user/login 获取 token，
        请求头携带 `Authorization: Bearer <token>`。

        **权限级别**：
        - public 接口：无需 Token
        - trader 接口：需有效 Token
        - admin 接口：需有效 Token + admin 角色

        后端 middleware 根据端点权限级别校验 Token 和角色。
  schemas:
    # 基础数据类型
    StockItem:
      type: object
      properties:
        symbol:
          type: string
          example: '000002'
        name:
          type: string
          example: '中国银行'
    
    FutureItem:
      type: object
      properties:
        symbol:
          type: string
          example: cffex2503
        name:
          type: string
        exchange:
          type: string
          example: xxx
    
    # 响应数据结构
    StockList:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 0
        status:
          type: string
          description: Order Status
          example: success
          enum:
            - fail
            - success
        stocks:
          type: array
          description: stock list
          items:
            $ref: "#/components/schemas/StockItem"
    
    StockDetail:
      type: object
      properties:
        price:
          type: number
          description: 价格
          example: 12.2
        volume:
          type: integer
          description: 交易量
          example: 168
    
    IndexQuote:
      type: object
      properties:
        price:
          type: number
          description: 价格
        change:
          type: number
          description: 涨跌幅
    
    Quote:
      type: object
      properties:
        datetime:
          type: string
          description: 时间
          example: 2024/03/12 00:01:22
        open:
          type: number
          description: 开盘价
          example: 12.2
        close:
          type: number
          description: 收盘价
          example: 12.2
        high:
          type: number
          description: 最高价
          example: 12.2
        low:
          type: number
          description: 最低价
          example: 12.2
        volume:
          type: number
          description: 交易额
          example: 12.2
        turnover:
          type: number
          description: 换手率
          example: 12.2
    
    SectorItem:
      type: object
      properties:
        name:
          type: string
          description: 板块名
        value:
          type: array
          items:
            $ref: "#/components/schemas/SectorFlowItem"
    
    SectorFlowItem:
      type: object
      properties:
        date:
          type: string
          description: 日期
        main:
          type: number
          description: 主力净流入
        supbig:
          type: number
          description: 超大单净流入
        big:
          type: number
          description: 大单净流入
        mid:
          type: number
          description: 中单净流入
        small:
          type: number
          description: 小单净流入
    
    OperatorItem:
      type: object
      description: 买卖的信息
      properties:
        symb:
          type: string
          description: 合约
        dt:
          type: integer
          description: 时间
        p:
          type: number
          description: 价格
        q:
          type: integer
          description: 数量
    
    StopLossTarget:
      type: object
