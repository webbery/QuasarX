openapi: "3.0.3"
info:
  title: QuasarX API
  description: |
    QuasarX Rest API接口

    ## 权限模型

    API 按权限分为三个级别，通过 JWT Bearer Token 认证：

    | 权限级别 | 说明 | 覆盖范围 |
    |----------|------|----------|
    | **public** | 只读金融信息获取 | 行情/财务/分析/回测等查询接口，无需 Token |
    | **trader** | 交易执行与数据管理 | 下单/撤单/策略控制/风控配置/数据管理/ML训练，需 JWT Token |
    | **admin** | 用户与账户管理 | 用户切换/账户增删，需 JWT Token + admin 角色 |

    未标注 `security` 的接口为 public（无需认证）。
  version: "0.0.1"
servers:
  - url: http://localhost:19107/v0

tags:
  # ═══ 金融信息获取（public，无需认证） ═══
  - name: Stocks
    description: 股票数据查询（public）
  - name: Options
    description: 期权数据与定价（public）
  - name: Index
    description: 指数数据（public）
  - name: Future
    description: 期货数据（public）
  - name: Feature
    description: 特征数据（public）
  - name: Quote
    description: 行情数据管理（GET=public，POST/DELETE=trader）
  - name: Finance
    description: 财务数据管理（GET=public，POST/DELETE=trader）
  - name: Dividend
    description: 分红除权数据（GET=public，POST/DELETE=trader）
  - name: Analysis
    description: 分析功能（public）
  - name: Backtest
    description: 回测与容量（public）
  - name: XGBoost
    description: 机器学习（collect/shap/train_status=public，train/optimize/delete=trader）
  - name: Predict
    description: 价格预测（public）
  - name: Strategy
    description: 策略管理（GET=public，POST/DELETE=trader）
  - name: Risk
    description: 风控管理（GET 查询=public，POST/DELETE 配置=trader）
  # ═══ 交易执行（trader，需 JWT Token） ═══
  - name: Order
    description: 订单交易（trader）
  - name: Portfolio
    description: 投资组合（trader）
  - name: Position
    description: 持仓信息（public）
  - name: Simulate
    description: 交易所仿真（trader）
  # ═══ 用户权限（admin，需 JWT Token + admin 角色） ═══
  - name: User
    description: 用户与账户管理（登录/登出/资金查询=public，账户增删改=admin）
  - name: Server
    description: 服务器事件（public）
  - name: Data
    description: 数据同步（trader）

paths:
  /stocks/simple:
    get:
      summary: stock's symbol and name
      description: 获取所有股票的代码和名称
      tags: 
        - Stocks
      responses:
        '200':
          description: An array of stocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockList"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stocks/detail:
    get:
      summary: stock detail info
      description: 当前时刻股票的信息(价格/量/换手率等)
      tags:
        - Stocks
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: 要获取的合约代码
      responses:
        '200':
          description: An array of stocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDetail"
  /stocks/history:
    get:
      summary: get stock history
      description: 获取股票历史 K 线数据
      tags:
        - Stocks
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 标的代码，格式为 代码.交易所大写（如 000001.SZ、600000.SH、920108.BJ）
          example: 000001.SZ
        - in: query
          name: type
          schema:
            type: string
          description: 数据频率（1d=日线, 5m=5分钟, 15m=15分钟, 30m=30分钟, 60m=60分钟）
          example: 1d
        - in: query
          name: start
          schema:
            type: integer
          description: 起始时间，Unix 秒级时间戳（如 1672531200 表示 2023-01-01 00:00:00）
          example: 1672531200
        - in: query
          name: end
          schema:
            type: integer
          description: 结束时间，Unix 秒级时间戳（如 1767225599 表示 2025-12-31 23:59:59）
          example: 1767225599
        - in: query
          name: right
          schema:
            type: integer
          description: 复权方式，1=后复权(HFQ)，其他/缺省=不复权
          example: 1
      responses:
        '200':
          description: 历史 K 线数据数组（按时间升序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
        '400':
          description: 查询无数据（标的不存在、时间范围无数据或标的不在市场注册表中）
  /stocks/params:
    get:
      summary: 获取股票下单参数
      description: 获取股票下单参数
      tags: 
        - Stocks
      responses:
        '200':
          description: An array of stocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_limit:
                    type: integer
                    description: 每秒下单最大次数
                  daily_limit:
                    type: integer
                    description: 每日下单最大次数
                  cancel_limit:
                    type: integer
                    description: 每秒撤单最大次数
    put:
      summary: 股票下单参数设置
      security:
        - BearerAuth: []
      description: 股票下单参数设置
      tags: 
        - Stocks
      requestBody:
        description: 下单参数
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_limit:
                  type: integer
                  description: 每秒下单最大次数
                daily_limit:
                  type: integer
                  description: 每日下单最大次数
                cancel_limit:
                  type: integer
                  description: 每秒撤单最大次数
      responses:
        '200':
          description: success or not
  /stocks/sector/flow:
    get:
      summary: get flow info
      description: 获取板块资金流信息
      tags:
        - Sector
      parameters:
        - in: query
          name: type
          schema:
            type: integer
            description: 1- 所有历史 0- 当日信息
      responses:
        '200':
          description: An array of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorItem"
  /stocks/sector/quote:
    get:
      summary: 行业板块实时行情
      description: 获取当前所有行业板块的实时行情数据，按涨跌幅排名
      tags:
        - Sector
      responses:
        '200':
          description: 行业板块行情列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  date:
                    type: string
                    description: 日期
                    example: "2025-06-03"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectorQuote"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stocks/verbose:
    get:
      summary: stock verbose info
      x-not-implemented: true
      description: 股票的详细信息(基本面/板块/十大股东/主营业务等)
      tags:
        - Stocks
      parameters:
      - in: query
        name: id
        schema:
          type: integer
          description: 要获取的合约代码
      responses:
        '200':
          description: An array of sectors
          content:
            application/json:
              schema:
                type: object
  /stocks/privilege:
    get:
      summary: 查询股票的交易权限
      description: 查询股票的交易权限
      tags:
        - Stocks
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 要查询的股票代码
      responses:
        '200':
          description: An array of stocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  forbid:
                    type: boolean
                    description: 是否禁止交易
                  message:
                    type: string
                    description: 禁止交易原因
        '400':
          description: 失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: integer
                    description: 失败错误码
  /stocks/range:
    get:
      summary: 获取股票当日涨跌停价格
      x-not-implemented: true
      description: 获取股票当日涨跌停价格
      tags:
        - Stocks
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 要获取的股票代码
      responses:
          '200':
            description: An array of stocks
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    code:
                      type: string
                      description: 股票代码
                    upper:
                      type: number
                      description: 股票涨停价
                    lower:
                      type: number
                      description: 股票跌停价
  /options/detail:
    get:
      summary: 当前期权的信息
      description: 当前期权的信息(基本信息、希腊字母及隐波等)
      tags:
        - Options
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 要获取的期权代码
        - in: query
          name: type
          schema:
            type: integer
          description: 期权代码类型 0-上交所深交所etf期权, 1-期货类期权
      responses:
          '200':
            description: An array of stocks
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 期权名称
                    symbol:
                      type: string
                      description: 期权代码

  /option/simple:
    get:
      summary: 所有期权合约列表
      description: 获取所有期权合约的代码和名称（symbol + name）
      tags:
        - Options
      responses:
        '200':
          description: 期权合约列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: 期权代码
                    name:
                      type: string
                      description: 期权名称
  /option/history:
    get:
      summary: 期权历史行情查询
      description: 查询期权合约的历史 K 线数据
      tags:
        - Options
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 期权合约代码
        - in: query
          name: start_date
          schema:
            type: string
          description: 开始日期（YYYY-MM-DD）
        - in: query
          name: end_date
          schema:
            type: string
          description: 结束日期（YYYY-MM-DD）
      responses:
        '200':
          description: 历史行情数据
          content:
            application/json:
              schema:
                type: object
  /option/data:
    post:
      summary: 期权数据下载
      security:
        - BearerAuth: []
      description: 触发期权数据下载（异步任务）
      tags:
        - Options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 任务已启动
          content:
            application/json:
              schema:
                type: object
    get:
      summary: 期权数据查询
      description: 查询已下载的期权数据
      tags:
        - Options
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: 期权合约代码
      responses:
        '200':
          description: 期权数据
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: 期权数据清理
      security:
        - BearerAuth: []
      description: 删除期权数据
      tags:
        - Options
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: 期权合约代码（留空删除全部）
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
  /option/detail:
    get:
      summary: 期权合约详情
      description: 获取期权合约的详细信息（合约要素、希腊字母、隐含波动率等）
      tags:
        - Options
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 期权合约代码
      responses:
        '200':
          description: 期权合约详情
          content:
            application/json:
              schema:
                type: object

  /option/pricing:
    post:
      summary: 期权定价
      description: 使用 BSM / Monte Carlo / Binomial Tree 对期权合约定价
      tags:
        - Options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strike, is_call]
              properties:
                method:
                  type: string
                  enum: [black_scholes, monte_carlo, binomial]
                  default: black_scholes
                spot:
                  type: number
                  description: 标的价格
                strike:
                  type: number
                  description: 行权价
                expiry:
                  type: string
                  description: 到期日 YYYY-MM-DD
                T:
                  type: number
                  description: 到期时间(年)，与 expiry 二选一
                volatility:
                  type: number
                  description: 隐含波动率
                risk_free_rate:
                  type: number
                  default: 0.015
                dividend_yield:
                  type: number
                  default: 0
                is_call:
                  type: boolean
                is_american:
                  type: boolean
                  default: false
                n_paths:
                  type: integer
                  description: MC 模拟路径数
                  default: 100000
                n_steps:
                  type: integer
                  description: MC/Tree 步数
                  default: 252
      responses:
        '200':
          description: 定价结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: number
                  intrinsic_value:
                    type: number
                  time_value:
                    type: number
                  moneyness:
                    type: string
                    enum: [ITM, ATM, OTM]
                  greeks:
                    type: object
                    properties:
                      delta: { type: number }
                      gamma: { type: number }
                      theta: { type: number }
                      vega: { type: number }
                      rho: { type: number }
                  payoff_curve:
                    type: array
                    items:
                      type: object
                      properties:
                        spot: { type: number }
                        payoff_at_expiry: { type: number }
                        payoff_now: { type: number }
                  mc_std_error:
                    type: number
                    description: 仅 monte_carlo 方法
                  early_exercise_premium:
                    type: number
                    description: 仅 binomial 方法

  /option/pricing_multi:
    post:
      summary: 多合约批量定价
      description: 同时定价多个合约，用于对比分析
      tags:
        - Options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contracts, spot]
              properties:
                method:
                  type: string
                  enum: [black_scholes, monte_carlo, binomial]
                spot:
                  type: number
                volatility:
                  type: number
                risk_free_rate:
                  type: number
                contracts:
                  type: array
                  items:
                    type: object
                    properties:
                      strike: { type: number }
                      is_call: { type: boolean }
                      expiry: { type: string }
                      T: { type: number }
                      volatility: { type: number }
                      is_american: { type: boolean }
      responses:
        '200':
          description: 每个合约的定价结果数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    strike: { type: number }
                    is_call: { type: boolean }
                    price: { type: number }
                    greeks:
                      type: object
                      properties:
                        delta: { type: number }
                        gamma: { type: number }
                        theta: { type: number }
                        vega: { type: number }
                        rho: { type: number }

  /option/iv_surface:
    get:
      summary: IV 曲面数据
      description: 返回隐含波动率曲面（原始数据点 + 插值网格）
      tags:
        - Options
      parameters:
        - in: query
          name: exchange
          required: true
          schema:
            type: string
            enum: [CFFEX, SSE, SZSE]
        - in: query
          name: product
          required: true
          schema:
            type: string
      responses:
        '200':
          description: IV 曲面
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw_points:
                    type: array
                    items:
                      type: object
                      properties:
                        strike: { type: number }
                        expiry_days: { type: integer }
                        iv: { type: number }
                        contract_name: { type: string }
                        call_put: { type: string }
                  strikes:
                    type: array
                    items: { type: number }
                  expiry_days:
                    type: array
                    items: { type: integer }
                  surface:
                    type: array
                    description: 二维数组 [expiry_idx][strike_idx]
                    items:
                      type: array
                      items: { type: number }
                  count:
                    type: integer

  /index/quote:
    get:
      summary: get index info
      description: 获取指数信息
      tags: 
        - Index
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: 要获取的指数代码,多个时用逗号分开
      responses:
        '200':
          description: An array of stocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexQuote"
  /market/shibor:
    get:
      summary: Shibor 银行间同业拆借利率
      description: 查询 Shibor 银行间同业拆借利率历史数据
      tags:
        - Index
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
          description: 开始日期（YYYY-MM-DD）
        - in: query
          name: end_date
          schema:
            type: string
          description: 结束日期（YYYY-MM-DD）
      responses:
        '200':
          description: Shibor 利率数据
          content:
            application/json:
              schema:
                type: object
  /market/macro:
    get:
      summary: 宏观经济指标
      description: 查询宏观经济指标数据（CPI/PPI/PMI/M2 等）
      tags:
        - Index
      parameters:
        - in: query
          name: indicator
          schema:
            type: string
          description: 指标名称（如 CPI/PPI/PMI/M2）
        - in: query
          name: start_date
          schema:
            type: string
          description: 开始日期（YYYY-MM-DD）
        - in: query
          name: end_date
          schema:
            type: string
          description: 结束日期（YYYY-MM-DD）
      responses:
        '200':
          description: 宏观经济指标数据
          content:
            application/json:
              schema:
                type: object
  /simulate:
    post:
      summary: simulate a exchange
      x-not-implemented: true
      security:
        - BearerAuth: []
      description: 交易所仿真
      tags: 
        - Simulate
      requestBody:
        description: 交易所信息
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        '200':
          description: success or not
  /risk/stoploss:
    post:
      summary: stoploss
      security:
        - BearerAuth: []
      description: 止损设置
      tags: 
        - Risk
      requestBody:
        description: 止损参数
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopLossRequest"
      responses:
        '200':
          description: success or not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopLossResponse"
    delete:
      summary: stoploss
      security:
        - BearerAuth: []
      description: 删除设置的止损
      tags: 
        - Risk
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: 要删除的id
      responses:
        '200':
          description: success
    get:
      summary: stoploss
      description: 获取所有设置的止损
      tags: 
        - Risk
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StopLossList"
  /risk/var:
    post:
      summary: run strategy for VaR
      x-route-disabled: true
      security:
        - BearerAuth: []
      description: 计算策略的VaR
      tags:
        - Risk
      requestBody:
        description: 计算VaR的参数
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaRRequest"
      responses:
        '200':
          description: success or not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaRResponse"
    get:
      summary: get strategy of history VaR
      description: 获取历史计算出的策略的VaR
      tags:
        - Risk
      parameters:
        - in: query
          name: id
          schema:
            type: integer
            description: 佣金id
      responses:
        '200':
          description: success or not
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaRHistoryItem"
  /risk/drawdown:
    get:
      summary: drawdown
      x-not-implemented: true
      description: 获取给定时间范围内的最大回撤
      tags:
        - Risk
      parameters:
        - in: query
          name: range
          schema:
            type: integer
            enum: [0, 1]
            description: 0-近90天,1-指定时间开始
            example: 0
        - in: query
          name: symbol
          schema:
            type: string
            description: 多个合约或者指定的持仓
            example: ap2501C2508,ap2502C2509
        - in: query
          name: datetime
          schema:
            type: integer
            description: 可选, 当type=1时指定的时间,单位s
            example: 1739174267836
      responses:
        '200':
          description: success or not
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
  /risk/capital:
