  # ═══════════════════════════════════════════════════════════
  #  机器学习训练与分析
  # ═══════════════════════════════════════════════════════════
  /ml:
    post:
      summary: ML 训练 / SHAP 计算 / 模型管理
      description: |
        单端点设计，通过 body 中的 "action" 字段路由不同操作：

        - action=train：训练模型
          1. 解析策略图，提取 XGBoost 上游子图
          2. 部分执行回测，收集节点输出作为特征
          3. 调用 xgboost_train.py 训练模型
          4. 返回学习曲线、特征重要性、评估指标、预测结果等 JSON
          5. 模型句柄保留在内存供 SHAP 计算

        - action=optimize：Optuna 自动优化 + 快速回测评估
          1. 前端先调 action=collect 拿到 csv_path 作为 feature_cache 传入
          2. 后端后台线程启动 xgboost_optimize.py
          3. 每个 Optuna trial：训练模型 → 保存到 experiments/ → 调 /v0/backtest
             （feature_cache + model_path 快速模式）→ 解析 summary[optimize_metric]
          4. SSE 流式推送 trial/value/result 事件
          5. 通过 GET /v0/ml?action=train_status&session_id=... 读取最终 best_params

        - action=collect：收集特征数据
          与 train 共享上游子图执行逻辑，但只收集不训练，返回 csv_path

        - action=shap：计算 SHAP 值
          使用 XGBoost C API 在 C++ 端直接计算（XGBOOST_OUTPUT_CONTRIBUTION），
          不依赖 Python shap 库，不持久化到数据库。

        - action=delete：释放内存中的模型

        训练结果（学习曲线/特征重要性/评估指标/预测）不存数据库，
        训练完成后通过单次 JSON 响应返回前端，前端 useXGBoostState 缓存。
      tags:
        - XGBoost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/XGBoostTrainRequest"
                - $ref: "#/components/schemas/XGBoostShapRequest"
                - $ref: "#/components/schemas/XGBoostDeleteRequest"
                - $ref: "#/components/schemas/XGBoostOptimizeRequest"
            examples:
              train:
                summary: 训练模型
                value:
                  action: train
                  script: '{"id":"strategy_demo","nodes":[...], "edges":[...]}'
                  label:
                    source: sh.600000.close
                    period: 5
                    type: classification
                    threshold: 0.0
                  objective: binary:logistic
                  num_class: 2
                  test_ratio: 0.2
                  params:
                    learning_rate: 0.1
                    max_depth: 6
                    n_estimators: 200
                    early_stopping_rounds: 20
              optimize:
                summary: Optuna 自动优化（快速回测评估）
                value:
                  action: optimize
                  feature_cache: /tmp/xgb_data_xxx.csv
                  fast_backtest_strategy: '{"id":"cta_v13","nodes":[...],"edges":[...]}'
                  label:
                    shape: matrix
                    period: 5
                    type: classification
                    vol_k: 0.5
                  n_trials: 20
                  optimize_metric: sharpe
                  param_domains: '{"learning_rate":{"min":0.005,"max":0.3,"log":true}}'
                  objective: multi:softprob
                  num_class: 3
                  test_ratio: 0.2
              shap:
                summary: 计算 SHAP 值
                value:
                  action: shap
                  model_id: 1
              delete:
                summary: 删除模型
                value:
                  action: delete
                  model_id: 1
      responses:
        '200':
          description: |
            操作结果。
            train 返回训练指标 + predictions + feature_importance + learning_curve + model_id
            optimize 立即返回 session_id（运行中），最终结果通过 train_status 获取
            shap 返回 shap 矩阵 + features + base_value
            delete 简单返回 message
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/XGBoostTrainResponse"
                  - $ref: "#/components/schemas/XGBoostOptimizeSubmitResponse"
                  - $ref: "#/components/schemas/XGBoostShapResponse"
                  - $ref: "#/components/schemas/XGBoostDeleteResponse"
        '400':
          description: 参数错误（如缺 action 字段、label.source 缺失）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: 模型未找到（shap/delete 操作时）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    # 基础数据类型
    StockItem:
      type: object
      properties:
        symbol:
          type: string
          example: '000002'
        name:
          type: string
          example: '中国银行'
    
    FutureItem:
      type: object
      properties:
        symbol:
          type: string
          example: cffex2503
        name:
          type: string
        exchange:
          type: string
          example: xxx
    
    # 响应数据结构
    StockList:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 0
        status:
          type: string
          description: Order Status
          example: success
          enum:
            - fail
            - success
        stocks:
          type: array
          description: stock list
          items:
            $ref: "#/components/schemas/StockItem"
    
    StockDetail:
      type: object
      properties:
        price:
          type: number
          description: 价格
          example: 12.2
        volume:
          type: integer
          description: 交易量
          example: 168
    
    IndexQuote:
      type: object
      properties:
        price:
          type: number
          description: 价格
        change:
          type: number
          description: 涨跌幅
    
    Quote:
      type: object
      properties:
        datetime:
          type: string
          description: 时间
          example: 2024/03/12 00:01:22
        open:
          type: number
          description: 开盘价
          example: 12.2
        close:
          type: number
          description: 收盘价
          example: 12.2
        high:
          type: number
          description: 最高价
          example: 12.2
        low:
          type: number
          description: 最低价
          example: 12.2
        volume:
          type: number
          description: 交易额
          example: 12.2
        turnover:
          type: number
          description: 换手率
          example: 12.2
    
    SectorItem:
      type: object
      properties:
        name:
          type: string
          description: 板块名
        value:
          type: array
          items:
            $ref: "#/components/schemas/SectorFlowItem"
    
    SectorFlowItem:
      type: object
      properties:
        date:
          type: string
          description: 日期
        main:
          type: number
          description: 主力净流入
        supbig:
          type: number
          description: 超大单净流入
        big:
          type: number
          description: 大单净流入
        mid:
          type: number
          description: 中单净流入
        small:
          type: number
          description: 小单净流入
    
    OperatorItem:
      type: object
      description: 买卖的信息
      properties:
        symb:
          type: string
          description: 合约
        dt:
          type: integer
          description: 时间
        p:
          type: number
          description: 价格
