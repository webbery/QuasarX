          example: 1000000

    DailyRiskConfig:
      type: object
      description: 单日亏损风控配置和状态
      properties:
        dailyMaxLossPercent:
          type: number
          description: 单日最大亏损限额比例 (相对于昨日权益)
          example: 0.03
        enableDailyLossLimit:
          type: boolean
          description: 是否启用单日亏损限额
          example: true
        autoClosePosition:
          type: boolean
          description: 触及止损后是否自动平仓
          example: false
        manualInterventionTimeoutSec:
          type: integer
